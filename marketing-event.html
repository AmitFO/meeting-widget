<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Requests</title>
<!--ZOHO_SDK--><script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script><!--/ZOHO_SDK-->
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --ink:#18202E; --muted:#5B6578; --line:#DCE1E8; --line-soft:#EBEEF2;
  --gtm:#1F6F78; --gtm-soft:#E4F1F2; --mkt:#3A47A8; --mkt-soft:#E8EAF7;
  --up:#A33A2B; --up-soft:#F8E6E3; --down:#2D7A4B; --down-soft:#E3F2E8; --focus:#3A47A8;
  --field:#FFFFFF; --field-off:#F1F3F6;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12161D; --surface:#1A2029; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2E3644; --line-soft:#252C38;
  --gtm:#5FB7C0; --gtm-soft:#1C3236; --mkt:#8E98E8; --mkt-soft:#232848;
  --up:#E8857A; --up-soft:#3A2420; --down:#72C493; --down-soft:#1C3326; --focus:#8E98E8;
  --field:#141920; --field-off:#1F2530; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12161D; --surface:#1A2029; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2E3644; --line-soft:#252C38;
  --gtm:#5FB7C0; --gtm-soft:#1C3236; --mkt:#8E98E8; --mkt-soft:#232848;
  --up:#E8857A; --up-soft:#3A2420; --down:#72C493; --down-soft:#1C3326; --focus:#8E98E8;
  --field:#141920; --field-off:#1F2530; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:20px 20px 120px}
h1{font-size:24px;line-height:1.25;margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 4px;font-weight:600}
p{margin:0}
.sub{color:var(--muted);font-size:13.5px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.demo{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:13.5px}
.demo .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.demo .seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer}
.demo .seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.linkbtn{border:0;background:none;color:var(--mkt);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}

.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;background:var(--surface);white-space:nowrap}
.chip b{font-weight:600}
.you-gtm{border-color:var(--gtm);color:var(--gtm)}
.you-mkt{border-color:var(--mkt);color:var(--mkt)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
.panel-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}

.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cat{border:1px solid var(--line);border-radius:8px;background:var(--field);padding:14px;text-align:left;cursor:pointer}
.cat strong{display:block;font-weight:600}
.cat span{font-size:13px;color:var(--muted)}
.cat[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cat:disabled{cursor:default}
.subtypes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{border:1px solid var(--line);border-radius:20px;background:var(--field);padding:6px 14px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.auto-note{margin-top:12px;font-size:13.5px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 16px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}
label.f{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
label.f i{font-style:normal;color:var(--up)}
.in{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:8px 10px;min-height:38px}
.in:disabled,.in[readonly]{background:var(--field-off);color:var(--muted)}
textarea.in{min-height:72px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.hint.err{color:var(--up)}
.hint.ok{color:var(--down)}
.owner{display:flex;align-items:center;gap:8px;min-height:38px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--field-off)}
.owner .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.owner.found .dot{background:var(--down)}
.typeahead{position:relative}
.ta-list{position:absolute;z-index:5;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:6px;max-height:200px;overflow:auto;list-style:none;padding:4px;margin-left:0}
.ta-list li button{width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:4px;cursor:pointer}
.ta-list li button:hover{background:var(--field-off)}

/* Negotiation ledger */
.ledger-wrap{overflow-x:auto}
table.ledger{width:100%;border-collapse:collapse;min-width:640px}
.ledger th,.ledger td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;text-align:left}
.ledger thead th{font-size:13px;font-weight:600;border-bottom:1px solid var(--line)}
.ledger thead th.gtm{color:var(--gtm);background:var(--gtm-soft)}
.ledger thead th.mkt{color:var(--mkt);background:var(--mkt-soft)}
.ledger td.gtm{background:color-mix(in srgb,var(--gtm-soft) 45%,transparent)}
.ledger td.mkt{background:color-mix(in srgb,var(--mkt-soft) 45%,transparent)}
.ledger th[scope="row"]{font-weight:500;width:24%}
.ledger th[scope="row"] small{display:block;font-weight:400;color:var(--muted);font-size:12px;line-height:1.35}
.ledger .in{min-width:0}
.ledger tr.total th,.ledger tr.total td{font-weight:600;border-bottom:0}
.ledger tr.commit th,.ledger tr.commit td{font-weight:600}
.money{position:relative}
.money::before{content:"₹";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.money .in{padding-left:24px;text-align:right}
.diff{display:inline-block;font-size:12.5px;border-radius:4px;padding:2px 7px;white-space:nowrap}
.diff.same{color:var(--muted)}
.diff.up{color:var(--up);background:var(--up-soft)}
.diff.down{color:var(--down);background:var(--down-soft)}
.static{min-height:38px;display:flex;align-items:center}
.filecell{font-size:13px}
.filecell input{max-width:100%;font-size:13px}
.legend{font-size:13px;color:var(--muted)}

/* Sample draft — the proposal sheet approvers see */
.sheet-wrap{overflow-x:auto}
table.sheet{width:100%;border-collapse:collapse;min-width:640px;font-size:14px}
.sheet th,.sheet td{border:1px solid var(--ink);padding:8px 10px;vertical-align:middle}
.sheet thead th{font-weight:600;text-align:center}
.sheet td.ev{font-weight:600}
.sheet td.num{text-align:right}
.sheet td.ctr{text-align:center}
.sheet td.commit{font-size:20px;font-weight:700;text-align:center}
.sheet small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.sheet tfoot td{font-weight:600}

.remarks{margin-top:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:1040px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar .msg{font-size:13.5px;color:var(--muted);max-width:560px}
.bar .msg.err{color:var(--up)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 16px;font-weight:500;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.reject{background:var(--up);border-color:var(--up);color:#fff}
.btn.approve{background:var(--down);border-color:var(--down);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:6px;font-size:14px;z-index:20}

@media (max-width:720px){
  .cats{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr}
  .c2,.c3,.c4,.c6{grid-column:span 2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.form-grid .full{grid-column:1/-1}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.summary div{background:var(--field-off);border-radius:8px;padding:12px}
.summary span{display:block;font-size:12.5px;color:var(--muted)}
.summary b{font-size:18px;font-weight:600}
.note{font-size:13px;color:var(--muted);background:var(--field-off);border-radius:6px;padding:8px 12px;margin-bottom:14px}
.note.warn{color:var(--up);background:var(--up-soft)}
.side-gtm{border-color:var(--gtm)!important;color:var(--gtm)!important}
@media (max-width:720px){.form-grid,.summary{grid-template-columns:1fr}.listhead .btn{width:100%}.bar .btns{width:100%}.bar .btn{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <div id="demoBar" class="demo hidden" role="region" aria-label="Preview controls">
    <span>Preview mode, no CRM connection.</span>
    <span>View as
      <span class="seg" role="group" aria-label="View as">
        <button type="button" data-role="GTM" aria-pressed="false">GTM</button>
        <button type="button" data-role="MKT" aria-pressed="true">Marketing</button>
      </span>
    </span>
    <button type="button" class="linkbtn" id="resetDemo">Start over</button>
  </div>

  <!-- HOME: list of requests -->
  <section id="listView" aria-labelledby="listH">
    <div class="listhead">
      <div><h1 id="listH">Event requests</h1><p class="sub">Open a request to view or edit it, or raise a new one.</p></div>
      <button type="button" class="btn primary" id="newBtn">+ New event</button>
    </div>
    <div class="panel">
      <div class="filters">
        <label class="hidden" for="q">Search</label>
        <input class="in" id="q" type="search" placeholder="Search event name or number" autocomplete="off">
        <div class="opt" role="group" aria-label="Filter" id="filterBtns"></div>
      </div>
      <div class="ledger-wrap"><table class="list" id="list"></table></div>
      <div class="pager"><span id="pageInfo"></span><span><button type="button" class="btn" id="prevPg">Previous</button> <button type="button" class="btn" id="nextPg">Next</button></span></div>
    </div>
  </section>

  <!-- FORM: one set of values, saved to the GTM or Marketing fields by login -->
  <div id="formView" class="hidden">
    <button type="button" class="linkbtn back" id="backBtn">← All requests</button>
    <div class="head">
      <div><h1 id="title">New event request</h1><p class="sub" id="subtitle"></p></div>
      <div class="chips" id="chips"></div>
    </div>
    <div id="notes"></div>
    <section class="panel" aria-labelledby="infoH"><h2 id="infoH" style="margin-bottom:12px">Request</h2><div class="info" id="info"></div></section>
    <section class="panel" aria-labelledby="typeH"><h2 id="typeH" style="margin-bottom:12px">Event type</h2><div class="form-grid" id="secType"></div></section>
    <section class="panel" aria-labelledby="basicH"><h2 id="basicH" style="margin-bottom:12px">Basic details</h2><div class="form-grid" id="secBasic"></div></section>
    <section class="panel" aria-labelledby="otherH"><h2 id="otherH" style="margin-bottom:12px">Other details</h2><div class="form-grid" id="secOther"></div></section>
    <section class="panel" aria-labelledby="sumH"><h2 id="sumH" style="margin-bottom:12px">Summary</h2><div class="summary" id="summary"></div></section>
    <section class="panel hidden" id="remarksPanel" aria-labelledby="remH">
      <h2 id="remH" style="margin-bottom:8px">ZH rejection remarks</h2>
      <p class="sub" style="margin-bottom:8px">Paste what the ZH wrote in their email reply.</p>
      <label class="hidden" for="remarks">Rejection remarks</label>
      <textarea class="in" id="remarks"></textarea>
    </section>
  </div>
</div>

<div class="bar hidden" id="bar" role="region" aria-label="Actions">
  <div class="bar-in"><p class="msg" id="msg" aria-live="polite"></p><div class="btns" id="btns"></div></div>
</div>
<div class="toast hidden" id="toast" role="status"></div>

<script>
/* ============ CONFIG ============ */
const CFG = {
  MODULE:"Marketing_Events", PINCODE_MODULE:"Pincodes", DISTRICT_MODULE:"District", PARTNER_MODULE:"Accounts",
  CAC:2000, FOUNDER_LIMIT:50000, PARTNER_MULTIPLIER:100,
  MARKETING_KEYWORDS:["marketing"],   // role or profile name contains this → Marketing; everyone else → GTM
  ZH_BY_ZONE:{"North 1":{id:"681278000000676466",name:"Vivek Mishra"},"East":{id:"681278000000676466",name:"Vivek Mishra"},"North 2":{id:"681278000000676433",name:"Suraj Agrahari"},"South":{id:"681278000000813134",name:"Swapnil Omprakash Mandhana"},"West":{id:"681278000000676418",name:"Hariom Shivhare"}},
  TAG:{ PENDING_ZH:"Send to GTM Approval", ZH_OK:"GTM Approved", PENDING_AV:"Send to AV's Approval" },
  STATUS:{ DRAFT:"Draft", SUBMITTED:"Submitted", REJECTED:"Rejected", RESUBMITTED:"Resubmitted" }
};
const C = {status:"Status", tag:"Event_Tag", remarks:"Rejection_Remarks", district:"District", zh:"ZH", raisedBy:"Raised_by", number:"Event_Number"};
const ATTENDEE = ["50 + KDMs","100 + KDMs","150 + KDMs","200 + KDMs","250 + KDMs","400 + KDMs","500 + KDMs"];
const STATES = ["Andaman & Nicobar (UT)","Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chandigarh (UT)","Chhattisgarh","Dadra & Nagar Haveli (UT) and Daman & Diu (UT)","Delhi","Goa","Gujarat","Haryana","Himachal Pradesh","Jammu & Kashmir(UT)","Jharkhand","Karnataka","Kerala","Ladakh (UT)","Lakshadweep (UT)","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Nepal","Odisha","Puducherry (UT)","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal"];
const CATS = ["End Customer Event","Partner Event","Partner Branding"], EC_SUBS = ["Sponsored Event","Co-Sponsored Event"];
// k = key in the form, g = GTM field, m = Marketing field
const FIELDS = [
  {sec:"secType", k:"cat", label:"Event category", g:"Event_s_Category", m:"Event_Category", type:"category", req:true, full:true},
  {sec:"secType", k:"sub", label:"Event sub type", g:"Event_s_Sub_Type", m:"Event_Sub_Type", type:"subtype", req:true, full:true, show:()=>V.cat && V.cat!=="Partner Branding"},
  {sec:"secBasic", k:"name", label:"Event name", g:"Event_s_Name", m:"Event_Name", type:"text", req:true, full:true, ph:"e.g. Education Excellence Conclave – Jammu"},
  {sec:"secBasic", k:"date", label:"Event date", g:"Event_s_Date", m:"Event_Date", type:"date", req:true},
  {sec:"secBasic", k:"pin", label:"Pin code", g:"Event_s_Pin_code", m:"Pin_code", type:"pin", req:true},
  {sec:"secBasic", k:"address", label:"Address", g:"Event_s_Address", m:"Address", type:"textarea", req:true, full:true},
  {sec:"secBasic", k:"city", label:"City", g:"Event_s_City", m:"City", type:"text", req:true},
  {sec:"secBasic", k:"state", label:"State", g:"Event_s_State", m:"State", type:"select", options:STATES, req:true},
  {sec:"secBasic", k:"partner", label:"Partner", g:"Partner_On_Events", m:"Partner", type:"lookup", req:true, show:()=>V.cat==="Partner Event"||V.cat==="Partner Branding"||V.sub==="Co-Sponsored Event"},
  {sec:"secBasic", k:"share", label:"Teachmint share (%)", g:"Event_s_Share_by_Teachmint", m:"Teachmint_Share", type:"percent", req:true, show:()=>V.sub==="Co-Sponsored Event"},
  {sec:"secBasic", k:"agenda", label:"Event agenda", g:"Event_s_Agenda", m:"Event_Agenda", type:"file"},
  {sec:"secBasic", k:"photos", label:"Photographs", g:"Event_s_Photographs", m:"Photographs", type:"file", multiple:true, accept:"image/*"},
  {sec:"secBasic", k:"other", label:"Other details", g:"Event_s_Other_Details", m:"Other_Details", type:"textarea", full:true},
  {sec:"secOther", k:"attendee", label:"Expected attendee", g:"Event_s_Expected_Attendee", m:"Expected_Attendee", type:"select", options:ATTENDEE, req:true},
  {sec:"secOther", k:"spons", label:"Sponsorship cost", g:"Event_s_Sponsorship_Cost", m:"Sponsorship_Cost", type:"money", req:true},
  {sec:"secOther", k:"prod", label:"Production cost", g:"Event_s_Production_Cost", m:"Production_Cost", type:"money", help:"Booth branding, product standees, branding elements"},
  {sec:"secOther", k:"proc", label:"Procurement cost", g:"Event_s_Procurement_Cost", m:"Procurement_Cost", type:"money", help:"Brochures, merchandise, paper bags, gifts"},
  {sec:"secOther", k:"floor", label:"Floor plan", g:"Event_s_Floor_Plan", m:"Floor_Plan", type:"file"},
  {sec:"secOther", k:"stall", label:"Stall plan", g:"Event_s_Stall_Plan", m:"Stall_Plan", type:"file"}
];
const byK = k => FIELDS.find(f=>f.k===k);

/* ============ STATE ============ */
const S = {live:false, role:"MKT", user:{id:null,name:""}, recordId:null, rec:{}, files:{}, owner:null, zh:null, districtName:"", districtId:null, pin:"idle", ownerDirty:false, prefilled:false, busy:false, view:"list"};
let V = {};   // the one set of values shown in the form
const side = () => S.role==="MKT" ? "m" : "g";
const other = () => S.role==="MKT" ? "g" : "m";

/* ============ DATA (Zoho SDK, or preview data) ============ */
const MOCK = {
  pins:{"180001":{district:{id:"d1",name:"Jammu"},state:"Jammu & Kashmir(UT)",zone:"North 1",owner:{id:"u1",name:"District owner, Jammu"}},
        "560001":{district:{id:"d2",name:"Bengaluru Urban"},state:"Karnataka",zone:"South",owner:{id:"u2",name:"District owner, Bengaluru"}}},
  partners:[{id:"p1",Account_Name:"Brightpath Learning Solutions"},{id:"p2",Account_Name:"Kashmir Edu Systems"}],
  rows:[], n:0
};
const API = {
  async me(){
    if(!S.live) return {role:S.role, id:"me", name:"Preview user"};
    const r = await ZOHO.CRM.CONFIG.getCurrentUser(); const u = (r&&r.users&&r.users[0])||{};
    const hay = (((u.role||{}).name||"")+" "+((u.profile||{}).name||"")).toLowerCase();
    return {role:CFG.MARKETING_KEYWORDS.some(w=>hay.includes(w))?"MKT":"GTM", id:u.id, name:u.full_name||""};
  },
  async list(f){
    if(!S.live){ await wait(150); return {rows:MOCK.rows.filter(r=>matches(r,f)).map(r=>structuredClone(r)), more:false}; }
    const crit = criteria(f);
    const r = crit
      ? await ZOHO.CRM.API.searchRecord({Entity:CFG.MODULE, Type:"criteria", Query:crit, page:f.page, per_page:20})
      : await ZOHO.CRM.API.getAllRecords({Entity:CFG.MODULE, sort_order:"desc", page:f.page, per_page:20});
    return {rows:(r&&r.data)||[], more:!!(r&&r.info&&r.info.more_records)};
  },
  async load(id){
    if(!S.live) return structuredClone(MOCK.rows.find(r=>r.id===id)||{});
    const r = await ZOHO.CRM.API.getRecord({Entity:CFG.MODULE, RecordID:id}); return (r&&r.data&&r.data[0])||{};
  },
  async pincode(pin){
    if(!S.live){ await wait(300); return MOCK.pins[pin]||null; }
    const r = await ZOHO.CRM.API.searchRecord({Entity:CFG.PINCODE_MODULE, Type:"criteria", Query:"(Name:equals:"+pin+")"});
    const p = r&&r.data&&r.data[0]; if(!p||!p.District) return null;
    const d = await ZOHO.CRM.API.getRecord({Entity:CFG.DISTRICT_MODULE, RecordID:p.District.id});
    const dist = d&&d.data&&d.data[0]; if(!dist||!dist.Owner) return null;
    return {district:{id:dist.id,name:dist.Name}, state:dist.State||"", zone:dist.Zone||"", owner:{id:dist.Owner.id,name:dist.Owner.name}};
  },
  async partners(q){
    if(!S.live){ await wait(150); return MOCK.partners.filter(p=>p.Account_Name.toLowerCase().includes(q.toLowerCase())); }
    const r = await ZOHO.CRM.API.searchRecord({Entity:CFG.PARTNER_MODULE, Type:"word", Query:q}); return (r&&r.data)||[];
  },
  async save(data){
    if(!S.live){
      await wait(300);
      for(const [a,fs] of Object.entries(S.files)) data[a] = fs.map(f=>({File_Name__s:f.name}));
      if(data.Owner && S.owner) data.Owner = Object.assign({},S.owner);
      if(data[C.zh] && S.zh) data[C.zh] = Object.assign({},S.zh);
      if(data[C.district]) data[C.district] = {id:S.districtId, name:S.districtName};
      if(data[C.raisedBy]) data[C.raisedBy] = {id:"me", name:S.user.name};
      let row = MOCK.rows.find(r=>r.id===S.recordId);
      if(!row){ MOCK.n++; row = {id:"demo-"+MOCK.n, [C.number]:"ME - "+String(MOCK.n).padStart(4,"0"), [C.raisedBy]:{id:"me",name:S.user.name}}; MOCK.rows.unshift(row); }
      Object.assign(row, structuredClone(data)); return row.id;
    }
    for(const [a,fs] of Object.entries(S.files)){
      const ids = [];
      for(const f of fs){
        const u = await ZOHO.CRM.API.uploadFile({CONTENT_TYPE:"multipart", PARTS:[{headers:{"Content-Disposition":"file;"},content:"__FILE__"}], FILE:{fileParam:"content", file:f}});
        const row = u&&u.data&&u.data[0]; if(!row||!row.details) throw new Error("File upload failed: "+f.name); ids.push({file_id:row.details.id});
      }
      if(ids.length) data[a] = ids;
    }
    const r = S.recordId
      ? await ZOHO.CRM.API.updateRecord({Entity:CFG.MODULE, APIData:Object.assign({id:S.recordId},data), Trigger:["workflow"]})
      : await ZOHO.CRM.API.insertRecord({Entity:CFG.MODULE, APIData:data, Trigger:["workflow"]});
    const row = r&&r.data&&r.data[0];
    if(!row||row.code!=="SUCCESS") throw new Error((row&&(row.message+(row.details&&row.details.api_name?" ("+row.details.api_name+")":"")))||"CRM did not accept the record");
    return S.recordId || row.details.id;
  }
};

/* ============ HELPERS ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v==null?"":v).replace(/,/g,"")); return isNaN(n)?0:n; };
const has = v => Array.isArray(v) ? v.length>0 : (v&&typeof v==="object") ? !!v.id : (v!==undefined&&v!==null&&String(v).trim()!=="");
const inr = n => "₹"+Math.round(n).toLocaleString("en-IN");
const shown = f => !f.show || f.show();
const fileNames = v => Array.isArray(v) ? v.map(x=>x.File_Name__s||x.name||"file").join(", ") : "";
function ordinalDate(iso){ if(!iso) return ""; const d = new Date(iso+"T00:00:00"); if(isNaN(d)) return iso; const n=d.getDate(), s=(n%10===1&&n!==11)?"st":(n%10===2&&n!==12)?"nd":(n%10===3&&n!==13)?"rd":"th"; return n+s+" "+d.toLocaleString("en-GB",{month:"long"})+" "+d.getFullYear(); }
function lakhs(n){ return n>=1e7 ? "₹"+(+(n/1e7).toFixed(2))+" Cr" : n>=1e5 ? "₹"+(+(n/1e5).toFixed(2))+" lakh" : inr(n); }
function calc(){
  const co = V.sub==="Co-Sponsored Event", share = co ? (num(V.share)>0 ? Math.min(100,num(V.share)) : 100) : 100;
  const total = num(V.spons)*share/100 + num(V.prod) + num(V.proc);
  let commit = "–";
  if(total && V.cat==="Partner Event") commit = lakhs(total*CFG.PARTNER_MULTIPLIER)+" billing";
  else if(total && V.cat==="End Customer Event") commit = Math.ceil(total/CFG.CAC)+" IFP";
  return {total, commit, founder: total>CFG.FOUNDER_LIMIT};
}

/* ============ WHO CAN DO WHAT ============ */
function perms(){
  const st = S.rec[C.status]||"", tag = S.rec[C.tag]||"", isNew = !S.recordId, p = {edit:false, actions:[], note:""};
  if(S.role==="MKT"){
    if(isNew || st===CFG.STATUS.DRAFT || st===CFG.STATUS.REJECTED){ p.edit = true; p.actions = ["save","submit"]; p.note = st===CFG.STATUS.REJECTED ? "Rejected by the ZH. Update and resubmit." : "Save a draft anytime. Submit sends the details to the ZH by email."; }
    else if(tag===CFG.TAG.PENDING_ZH){ p.actions = ["zhReject","zhApprove"]; p.note = "Waiting for the ZH’s email reply. Record their decision here."; }
    else if(tag===CFG.TAG.ZH_OK){ p.actions = ["sendAV"]; p.note = "ZH approved. Send it to AV."+(calc().founder?" Above ₹50,000, so Divyansh approves after AV.":""); }
    else p.note = tag===CFG.TAG.PENDING_AV ? "With AV for approval." : "Read-only.";
  } else {
    if(isNew || st===CFG.STATUS.DRAFT){ p.edit = true; p.actions = ["save"]; p.note = isNew ? "Fill the event details and save. Marketing takes it forward." : "You can update your proposal until Marketing submits."; }
    else p.note = tag===CFG.TAG.PENDING_ZH ? "Sent to the ZH for approval." : tag===CFG.TAG.ZH_OK ? "Approved by the ZH." : tag===CFG.TAG.PENDING_AV ? "With AV for approval." : st===CFG.STATUS.REJECTED ? "Rejected by the ZH. Marketing is revising it." : "Read-only.";
  }
  return p;
}

/* ============ SAVE ============ */
function missing(){
  const out = [];
  for(const f of FIELDS){ if(!f.req || !shown(f)) continue; if(f.k==="sub" && V.cat==="Partner Event") continue; if(!has(V[f.k])) out.push(f.label.toLowerCase()); }
  if(has(V.pin) && S.pin==="missing") out.push("a mapped pin code");
  return out;
}
function fail(list){ $("msg").textContent = "Add "+list.join(", ")+" to continue."; $("msg").classList.add("err"); }
function payload(){
  const o = {}, s = side();
  for(const f of FIELDS){
    if(f.type==="file") continue;
    let v = V[f.k];
    if(f.k==="sub" && V.cat==="Partner Event") v = "Partner Enablement Event";
    if(f.type==="lookup") v = v&&v.id ? {id:v.id} : null;
    else if(f.type==="money"||f.type==="percent") v = has(v) ? num(v) : null;
    else if(!has(v)) v = null;
    o[f[s]] = v;
  }
  o.Name = V.name || "Event request";
  if(S.ownerDirty || !S.recordId){
    if(S.owner) o.Owner = {id:S.owner.id};
    if(S.districtId) o[C.district] = {id:S.districtId};
    if(S.zh) o[C.zh] = {id:S.zh.id};
  }
  if(!S.recordId && S.user.id) o[C.raisedBy] = {id:S.user.id};
  const files = {}; for(const f of FIELDS) if(f.type==="file" && S.files[f.k] && S.files[f.k].length) files[f[s]] = S.files[f.k];
  S.filesBySide = files;
  return o;
}
async function commit(data, okText){
  S.busy = true; render();
  try{
    const keep = S.files; S.files = S.filesBySide || {};
    S.recordId = await API.save(data); S.files = {}; S.filesBySide = null; S.ownerDirty = false;
    const fresh = await API.load(S.recordId); if(fresh && fresh.id) loadRecord(fresh);
    toast(okText);
  }catch(err){ $("msg").textContent = "Couldn’t save: "+(err.message||err); $("msg").classList.add("err"); }
  S.busy = false; render();
}
const ACT = {
  async save(){ if(S.role==="MKT"){ if(!has(V.name)) return fail(["event name"]); } else { const e = missing(); if(e.length) return fail(e); }
    const o = payload(); if(!S.recordId) o[C.status] = CFG.STATUS.DRAFT; await commit(o, S.role==="MKT"?"Draft saved.":"Saved. Marketing can take it forward."); },
  async submit(){ const e = missing(); if(e.length) return fail(e);
    const re = S.rec[C.status]===CFG.STATUS.REJECTED || S.rec[C.status]===CFG.STATUS.RESUBMITTED;
    const o = payload(); o[C.status] = re ? CFG.STATUS.RESUBMITTED : CFG.STATUS.SUBMITTED; o[C.tag] = CFG.TAG.PENDING_ZH;
    await commit(o, re?"Resubmitted. The ZH gets the email.":"Submitted. The ZH gets the email."); },
  async zhApprove(){ await commit({[C.tag]:CFG.TAG.ZH_OK, [C.remarks]:null}, "Marked as approved by the ZH."); },
  async zhReject(){ const rm = $("remarks").value.trim(); if(!rm){ $("remarks").focus(); return fail(["the ZH’s remarks"]); }
    await commit({[C.tag]:null, [C.status]:CFG.STATUS.REJECTED, [C.remarks]:rm}, "Marked as rejected. You can now update and resubmit."); },
  async sendAV(){ await commit({[C.tag]:CFG.TAG.PENDING_AV}, "Sent to AV."); }
};

/* ============ LOAD A RECORD INTO THE ONE-SET FORM ============ */
function loadRecord(rec){
  S.recordId = rec.id; S.rec = rec; V = {}; S.prefilled = false;
  const s = side(), o = other();
  for(const f of FIELDS){
    let v = rec[f[s]];
    if(!has(v) && has(rec[f[o]]) && f.type!=="file" && perms().edit){ v = rec[f[o]]; S.prefilled = true; }   // first time: start from the other side’s values
    V[f.k] = v==null ? "" : v;
  }
  if(rec.Owner) S.owner = {id:rec.Owner.id, name:rec.Owner.name};
  if(rec[C.zh]) S.zh = {id:rec[C.zh].id, name:rec[C.zh].name};
  if(rec[C.district]){ S.districtName = rec[C.district].name; S.districtId = rec[C.district].id; }
  S.pin = has(V.pin) && S.owner ? "found" : "idle";
  render();
}

const FILTERS = [["all","All"],["mine","Raised by me"],["draft","Drafts"],["zh","With ZH"],["rejected","Rejected"],["zhok","ZH approved"],["av","With AV"]];
const L = {filter:"all", q:"", page:1, more:false, rows:[], loading:false};
let listSeq = 0, qT;
function criteria(f){
  const c = [], esc2 = t => t.replace(/[(),]/g,"\\$&");
  if(f.filter==="mine") c.push("(Raised_by:equals:"+S.user.id+")");
  if(f.filter==="draft") c.push("(Status:equals:"+CFG.STATUS.DRAFT+")");
  if(f.filter==="zh") c.push("(Event_Tag:equals:"+esc2(CFG.TAG.PENDING_ZH)+")");
  if(f.filter==="rejected") c.push("(Status:equals:"+CFG.STATUS.REJECTED+")");
  if(f.filter==="zhok") c.push("(Event_Tag:equals:"+esc2(CFG.TAG.ZH_OK)+")");
  if(f.filter==="av") c.push("(Event_Tag:equals:"+esc2(CFG.TAG.PENDING_AV)+")");
  const t = esc2((f.q||"").trim());
  if(t){ const parts = ["(Name:starts_with:"+t+")"]; if(/^\d{1,4}$/.test(t)) parts.push("(Event_Number:equals:ME - "+t.padStart(4,"0")+")"); c.push(parts.length>1?"("+parts.join("or")+")":parts[0]); }
  return c.length ? (c.length>1 ? "("+c.join("and")+")" : c[0]) : "";
}
function matches(r,f){
  if(f.filter==="mine" && !(r[C.raisedBy]&&r[C.raisedBy].id===S.user.id)) return false;
  if(f.filter==="draft" && r.Status!==CFG.STATUS.DRAFT) return false;
  if(f.filter==="zh" && r.Event_Tag!==CFG.TAG.PENDING_ZH) return false;
  if(f.filter==="rejected" && r.Status!==CFG.STATUS.REJECTED) return false;
  if(f.filter==="zhok" && r.Event_Tag!==CFG.TAG.ZH_OK) return false;
  if(f.filter==="av" && r.Event_Tag!==CFG.TAG.PENDING_AV) return false;
  if(f.q && !((r.Name||"")+" "+(r.Event_Number||"")).toLowerCase().includes(f.q.toLowerCase())) return false;
  return true;
}

  else if(L.error) body = `<tr><td colspan="6" class="empty">Couldn’t load requests: ${esc(L.error)}</td></tr>`;
  else if(!L.rows.length) body = `<tr><td colspan="6" class="empty">${L.filter==="all"&&!L.q?"No event requests yet. Click “+ New event” to raise one.":"No requests match this filter."}</td></tr>`;
  else body = L.rows.map(r=>`<tr><td>${esc(r.Event_Number||"–")}</td><td><button type="button" class="open" data-open="${esc(r.id)}">${esc(r.Event_Name||r.Event_s_Name||r.Name||"Untitled")}</button></td><td>${esc(ordinalDate(r.Event_Date||r.Event_s_Date)||"–")}</td><td>${esc((r.Owner&&r.Owner.name)||"–")}</td><td>${r.Status?`<span class="chip">${esc(r.Status)}</span>`:"–"}</td><td>${esc(r.Event_Tag||"–")}</td></tr>`).join("");
  $("list").innerHTML = head+"<tbody>"+body+"</tbody>";
  $("pageInfo").textContent = L.rows.length ? "Page "+L.page : "";
  $("prevPg").disabled = L.page<=1||L.loading; $("nextPg").disabled = !L.more||L.loading;
}
function show(v){ S.view = v; $("listView").classList.toggle("hidden",v!=="list"); $("formView").classList.toggle("hidden",v!=="form"); $("bar").classList.toggle("hidden",v!=="form"); window.scrollTo(0,0); }
function blank(){ S.recordId = null; S.rec = {}; V = {}; S.files = {}; S.owner = null; S.zh = null; S.districtName = ""; S.districtId = null; S.pin = "idle"; S.ownerDirty = false; S.prefilled = false; clearErr(); }
function showList(){ show("list"); loadList(); }
function newRecord(){ blank(); show("form"); render(); }
async function openRecord(id){
  blank(); show("form"); $("msg").textContent = "Loading the request…"; $("btns").innerHTML = "";
  try{ const rec = await API.load(id); if(!rec.id) throw new Error("Record not found or no access."); loadRecord(rec); }
  catch(err){ $("msg").textContent = "Couldn’t open: "+(err.message||err); $("msg").classList.add("err"); }
}

/* ============ PREVIEW ============ */
function setRole(r){
  S.role = r; S.user = {id:"me", name:r==="MKT"?"Preview Marketing user":"Preview GTM user"};
  document.querySelectorAll("[data-role]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.role===r)));
  if(S.view==="form" && S.recordId) openRecord(S.recordId); else if(S.view==="form") render(); else loadList();
}

/* ============ BOOT ============ */
async function boot(entityId){
  const u = await API.me(); S.role = u.role; S.user = {id:u.id, name:u.name};
  if(entityId) openRecord(entityId); else showList();
}
if(window.ZOHO && ZOHO.embeddedApp){
  S.live = true;
  ZOHO.embeddedApp.on("PageLoad", d=>{ const id = d && (Array.isArray(d.EntityId)?d.EntityId[0]:d.EntityId); boot(id); });
  ZOHO.embeddedApp.init();
} else {
  $("demoBar").classList.remove("hidden");
  $("resetDemo").addEventListener("click",()=>{ MOCK.rows = []; MOCK.n = 0; showList(); });
  boot(null);
}
</script>
</body>
</html>

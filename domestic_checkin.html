<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Domestic Check In</title>
<script src="https://live.zwidgets.com/js-sdk/1.0.5/ZohoEmbededAppSDK.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #fff; color: #222; }
  .container {
    max-width: 100%;
    padding: 16px;
    text-align: center;
  }

  /* Loading State */
  .state { display: none; padding: 16px; }
  .state.active { display: block; }

  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #f0f0f0;
    border-top: 3px solid #2e7d32;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: #666; }

  /* Success State */
  .success-circle {
    width: 70px; height: 70px;
    background: #2e7d32;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
    animation: popIn 0.4s ease;
  }
  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  .checkmark { color: white; font-size: 35px; line-height: 1; }
  .success-title { font-size: 18px; font-weight: bold; color: #2e7d32; margin-bottom: 6px; }
  .success-sub { font-size: 12px; color: #666; }
  .coords { font-size: 11px; color: #999; margin-top: 6px; }

  /* Error State */
  .error-circle {
    width: 70px; height: 70px;
    background: #c62828;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
    animation: popIn 0.4s ease;
  }
  .error-mark { color: white; font-size: 35px; line-height: 1; }
  .error-title { font-size: 17px; font-weight: bold; color: #c62828; margin-bottom: 6px; }
  .error-sub { font-size: 12px; color: #666; }

  /* Already captured state */
  .already-circle {
    width: 70px; height: 70px;
    background: #1565c0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
  }
  .already-mark { color: white; font-size: 30px; line-height: 1; }
  .already-title { font-size: 17px; font-weight: bold; color: #1565c0; margin-bottom: 6px; }
  .already-sub { font-size: 12px; color: #666; }
</style>
</head>
<body>
<div class="container">

  <!-- Loading State -->
  <div class="state active" id="loadingState">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Initializing...</div>
  </div>

  <!-- Success State -->
  <div class="state" id="successState">
    <div class="success-circle">
      <span class="checkmark">&#10003;</span>
    </div>
    <div class="success-title">Location Captured</div>
    <div class="success-sub">Check-in location saved successfully!</div>
    <div class="coords" id="coordsText"></div>
  </div>

  <!-- Error State -->
  <div class="state" id="errorState">
    <div class="error-circle">
      <span class="error-mark">&#10007;</span>
    </div>
    <div class="error-title" id="errorTitle">Error</div>
    <div class="error-sub" id="errorSub"></div>
  </div>

  <!-- Already Captured State -->
  <div class="state" id="alreadyState">
    <div class="already-circle">
      <span class="already-mark">&#128205;</span>
    </div>
    <div class="already-title">Location Already Captured</div>
    <div class="already-sub" id="alreadyCoords"></div>
  </div>

</div>

<script>
var MODULE_API_NAME     = "Events";
var FIELD_UNIQUE_NUMBER = "Meeting_Unique_Number";
var FIELD_LATITUDE      = "Meeting_Latitude";
var FIELD_LONGITUDE     = "Meeting_Longitude";
var meetingId           = null;

function showState(id) {
  var states = ["loadingState","successState","errorState","alreadyState"];
  states.forEach(function(s) {
    document.getElementById(s).classList.remove("active");
  });
  document.getElementById(id).classList.add("active");
}

function setLoading(text) {
  document.getElementById("loadingText").textContent = text;
  showState("loadingState");
}

function showSuccess(lat, lng) {
  document.getElementById("coordsText").textContent =
    "Lat: " + lat.toFixed(6) + " | Lng: " + lng.toFixed(6);
  showState("successState");
}

function showError(title, sub) {
  document.getElementById("errorTitle").textContent = title;
  document.getElementById("errorSub").textContent   = sub;
  showState("errorState");
}

function showAlready(lat, lng) {
  document.getElementById("alreadyCoords").textContent =
    "Lat: " + lat + " | Lng: " + lng;
  showState("alreadyState");
}

function getLocation() {
  return new Promise(function(resolve, reject) {
    if (!navigator.geolocation) {
      reject(new Error("GPS not supported on this device."));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude });
      },
      function(err) {
        var msg = "Unable to capture location.";
        if (err.code === err.PERMISSION_DENIED)
          msg = "Location permission denied. Please allow location access.";
        else if (err.code === err.POSITION_UNAVAILABLE)
          msg = "Location unavailable. Check GPS settings.";
        else if (err.code === err.TIMEOUT)
          msg = "Location timed out. Please refresh.";
        reject(new Error(msg));
      },
      { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
    );
  });
}

ZOHO.embeddedApp.on("PageLoad", function(data) {
  if (data && data.EntityId) {
    meetingId = Array.isArray(data.EntityId) ? data.EntityId[0] : data.EntityId;
  } else if (data && data.recordId) {
    meetingId = data.recordId;
  }

  if (!meetingId) {
    showError("Error", "Unable to identify the Meeting record.");
    return;
  }

  setLoading("Checking meeting details...");

  ZOHO.CRM.API.getRecord({ Entity: MODULE_API_NAME, RecordID: meetingId })
    .then(function(response) {
      if (!response || !response.data || !response.data.length) {
        showError("Error", "Unable to load Meeting record.");
        return;
      }

      var meeting        = response.data[0];
      var uniqueNumber   = meeting[FIELD_UNIQUE_NUMBER];
      var existingLat    = meeting[FIELD_LATITUDE];
      var existingLng    = meeting[FIELD_LONGITUDE];

      // Not a Check-In meeting
      if (!uniqueNumber || uniqueNumber === "" || uniqueNumber === null) {
        showError(
          "This is not a Check-In meeting.",
          "GPS cannot be captured."
        );
        return;
      }

      // Location already captured
      if (existingLat && existingLng) {
        showAlready(existingLat, existingLng);
        return;
      }

      // Capture GPS
      setLoading("Capturing your location...");

      getLocation()
        .then(function(location) {
          setLoading("Saving location...");

          var updateData       = { id: meetingId };
          updateData[FIELD_LATITUDE]  = location.latitude;
          updateData[FIELD_LONGITUDE] = location.longitude;

          return ZOHO.CRM.API.updateRecord({
            Entity:  MODULE_API_NAME,
            APIData: updateData,
            Trigger: []
          }).then(function(res) {
            return { res: res, location: location };
          });
        })
        .then(function(result) {
          if (result.res && result.res.data &&
              result.res.data[0] && result.res.data[0].code === "SUCCESS") {
            showSuccess(result.location.latitude, result.location.longitude);
          } else {
            showError("Update Failed", "Could not save location. Please refresh.");
          }
        })
        .catch(function(error) {
          showError("Location Error", error.message || "Unable to capture GPS.");
        });
    })
    .catch(function(error) {
      showError("Error", "Unable to load Meeting record.");
    });
});

ZOHO.embeddedApp.init();
</script>
</body>
</html>

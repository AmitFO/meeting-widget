<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mark Meeting Status</title>
<script src="https://live.zwidgets.com/js-sdk/1.0.5/ZohoEmbeddedAppSDK.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f6fa;
    color: #222;
    font-size: 14px;
    min-height: 100vh;
  }
  .header {
    background: #1565c0;
    color: #fff;
    padding: 14px 16px;
    font-size: 17px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .container { padding: 14px 16px; max-width: 600px; margin: 0 auto; }

  .status-bar {
    background: #fff;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 14px;
    border-left: 4px solid #1565c0;
    font-size: 13px;
    color: #555;
  }
  .status-bar strong { color: #1565c0; font-size: 14px; }

  .field-group { margin-bottom: 14px; }
  .field-label {
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 13px;
    color: #333;
  }
  .field-label span.req { color: #c62828; margin-left: 2px; }

  select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
    outline: none;
    transition: border-color 0.2s;
  }
  select:focus, textarea:focus { border-color: #1565c0; }
  select.has-error, textarea.has-error, .upload-box.has-error { border-color: #c62828 !important; }
  textarea { min-height: 80px; resize: vertical; }

  /* ── Image Upload ── */
  .upload-box {
    border: 2px dashed #bbb;
    border-radius: 8px;
    background: #fafafa;
    text-align: center;
    padding: 22px 12px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }
  .upload-box:hover { border-color: #1565c0; background: #e8f0fe; }
  .upload-box input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .upload-box .upload-icon { font-size: 32px; margin-bottom: 6px; }
  .upload-box .upload-title { font-size: 14px; font-weight: 600; color: #444; }
  .upload-box .upload-sub { font-size: 11px; color: #888; margin-top: 4px; }

  /* quota bar */
  .quota-bar-wrap {
    margin-top: 10px;
    background: #e8eaf6;
    border-radius: 20px;
    height: 6px;
    overflow: hidden;
  }
  .quota-bar-fill {
    height: 100%;
    background: #1565c0;
    border-radius: 20px;
    transition: width 0.3s;
    width: 0%;
  }
  .quota-info {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #666;
    margin-top: 5px;
  }
  .quota-info .count-label { font-weight: 600; color: #333; }

  /* Upload status line */
  .upload-status {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 600;
    color: #2e7d32;
    min-height: 18px;
  }

  /* Thumbnail grid */
  .preview-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  .preview-item {
    position: relative;
    width: 72px;
    height: 72px;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid #ddd;
  }
  .preview-item img { width: 100%; height: 100%; object-fit: cover; }
  .preview-item .remove-btn {
    position: absolute;
    top: 2px; right: 2px;
    background: rgba(0,0,0,0.65);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 18px; height: 18px;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  /* Upload progress per-image */
  .upload-log {
    margin-top: 8px;
    font-size: 12px;
    color: #555;
    max-height: 80px;
    overflow-y: auto;
  }
  .upload-log-item { padding: 2px 0; }
  .upload-log-item.ok { color: #2e7d32; }
  .upload-log-item.fail { color: #c62828; }

  /* Section divider */
  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: #1565c0;
    margin: 18px 0 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid #e3e8f8;
  }

  /* Mark buttons */
  .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-complete { background: #2e7d32; color: #fff; }
  .btn-cancel   { background: #c62828; color: #fff; }
  .btn-postpone { background: #1565c0; color: #fff; }

  /* Upload images button */
  .btn-upload-only {
    width: 100%;
    padding: 11px;
    border: 2px solid #1565c0;
    border-radius: 8px;
    background: #fff;
    color: #1565c0;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
    transition: background 0.2s;
  }
  .btn-upload-only:hover { background: #e8f0fe; }
  .btn-upload-only:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Toast message */
  #toastMsg {
    display: none;
    margin: 12px 0 4px;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
  }
  #toastMsg.success { background: #e8f5e9; color: #2e7d32; border-left: 4px solid #2e7d32; }
  #toastMsg.error   { background: #ffebee; color: #c62828; border-left: 4px solid #c62828; }
  #toastMsg.info    { background: #e3f2fd; color: #1565c0; border-left: 4px solid #1565c0; }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
  }
  .spinner-dark {
    border-color: rgba(21,101,192,0.3);
    border-top-color: #1565c0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <span>📋</span> Mark Meeting Status
</div>

<div class="container">

  <div class="status-bar">
    Current Stage: <strong id="stageDisplay">Loading…</strong>
  </div>

  <!-- Meeting Purpose -->
  <div class="field-group">
    <div class="field-label">Meeting Purpose <span class="req">*</span></div>
    <select id="meetingPurpose" onchange="onPurposeChange()">
      <option value="">— Select Purpose —</option>
      <option value="Demo">Demo</option>
      <option value="Training">Training</option>
      <option value="Retention">Retention</option>
      <option value="Prospecting">Prospecting</option>
      <option value="Regular Visit">Regular Visit</option>
      <option value="Support">Support</option>
      <option value="Other">Other</option>
    </select>
  </div>

  <!-- Meeting Type -->
  <div class="field-group">
    <div class="field-label">Meeting Type <span class="req">*</span></div>
    <select id="meetingType">
      <option value="">— Select Type —</option>
      <option value="In-person Connect">In-person Connect</option>
      <option value="Virtual Connect">Virtual Connect</option>
      <option value="Phone Call">Phone Call</option>
    </select>
  </div>

  <!-- Description -->
  <div class="field-group">
    <div class="field-label">Description <span class="req">*</span></div>
    <textarea id="meetingDesc" placeholder="Enter meeting description…"></textarea>
  </div>

  <!-- Meeting Images -->
  <div class="field-group">
    <div class="field-label">
      Meeting Images <span class="req" id="imgReqMark"></span>
      <small id="imgReqHint" style="font-weight:400;color:#888;margin-left:4px;"></small>
    </div>

    <div class="upload-box" id="uploadBox">
      <input type="file" id="fileInput" accept="image/*" multiple onchange="onFilesSelected(event)">
      <div class="upload-icon">📷</div>
      <div class="upload-title">Tap to select images</div>
      <div class="upload-sub">Max 15 images · All formats · Max 20MB total</div>
    </div>

    <!-- Quota display -->
    <div id="quotaWrap" style="display:none;">
      <div class="quota-bar-wrap"><div class="quota-bar-fill" id="quotaFill"></div></div>
      <div class="quota-info">
        <span class="count-label" id="countLabel">0 of 15 images</span>
        <span id="sizeLabel">0.00 / 20.00 MB</span>
      </div>
    </div>

    <div class="preview-grid" id="previewGrid"></div>
    <div class="upload-log"  id="uploadLog"></div>
    <div class="upload-status" id="uploadStatus"></div>

    <button class="btn-upload-only" id="btnUploadOnly" onclick="uploadImagesOnly()" disabled>
      <span>⬆️</span> Upload Images
    </button>
  </div>

  <div id="toastMsg"></div>

  <div class="section-title">Mark Meeting</div>

  <div class="btn-group">
    <button class="btn btn-complete" id="btnComplete" onclick="processMeetingAction('Completed')">✔ Completed</button>
    <button class="btn btn-cancel"   id="btnCancel"   onclick="processMeetingAction('Cancelled')">✖ Cancelled</button>
    <button class="btn btn-postpone" id="btnPostpone" onclick="processMeetingAction('Postponed')">⏰ Postponed</button>
  </div>

</div><!-- /container -->

<script>
/* ── Constants ── */
var FIELD_PURPOSE  = "Meeting_Purpose";
var FIELD_TYPE     = "Meeting_Type";
var FIELD_DESC     = "Description";
var FIELD_STAGE    = "Meeting_Stage";
var FIELD_MARKED_BY= "Meeting_Status_Marked_By";
var FIELD_ACTION_DT= "Action_Date_Time";
var FIELD_LOCATION = "Meeting_Location";

var STAGE_COMPLETED = "Completed";
var STAGE_CANCELLED = "Cancelled";
var STAGE_POSTPONED = "Postponed";

var MAX_IMAGES   = 15;
var MAX_MB       = 20;
var MAX_BYTES    = MAX_MB * 1024 * 1024;

/* ── State ── */
var meetingId      = null;
var currentStage   = "";
var isProcessing   = false;
var selectedFiles  = [];          // files pending upload
var uploadedCount  = 0;           // total successfully uploaded this session
var uploadedBytes  = 0;           // total bytes uploaded this session

/* ── UI refs (set after DOMContentLoaded) ── */
var purposeEl, typeEl, descEl, uploadBox, fileInput,
    previewGrid, uploadLog, uploadStatus, quotaWrap,
    quotaFill, countLabel, sizeLabel, btnUploadOnly,
    stageDisplay, toastMsg, imgReqMark, imgReqHint;

document.addEventListener("DOMContentLoaded", function() {
  purposeEl    = document.getElementById("meetingPurpose");
  typeEl       = document.getElementById("meetingType");
  descEl       = document.getElementById("meetingDesc");
  uploadBox    = document.getElementById("uploadBox");
  fileInput    = document.getElementById("fileInput");
  previewGrid  = document.getElementById("previewGrid");
  uploadLog    = document.getElementById("uploadLog");
  uploadStatus = document.getElementById("uploadStatus");
  quotaWrap    = document.getElementById("quotaWrap");
  quotaFill    = document.getElementById("quotaFill");
  countLabel   = document.getElementById("countLabel");
  sizeLabel    = document.getElementById("sizeLabel");
  btnUploadOnly= document.getElementById("btnUploadOnly");
  stageDisplay = document.getElementById("stageDisplay");
  toastMsg     = document.getElementById("toastMsg");
  imgReqMark   = document.getElementById("imgReqMark");
  imgReqHint   = document.getElementById("imgReqHint");
  updateImageLabel();
});

/* ──────────────────────────────────────────
   Purpose change → update image label
────────────────────────────────────────── */
function onPurposeChange() { updateImageLabel(); }

function updateImageLabel() {
  if (!imgReqMark) return;
  var p = purposeEl ? purposeEl.value : "";
  if (p === "Demo" || p === "Training") {
    imgReqMark.textContent = "*";
    imgReqHint.textContent = "(at least 1 image required when marking Completed)";
    imgReqHint.style.color = "#c62828";
  } else {
    imgReqMark.textContent = "";
    imgReqHint.textContent = "(optional for this meeting purpose)";
    imgReqHint.style.color = "#888";
  }
}

/* ──────────────────────────────────────────
   Image selection
────────────────────────────────────────── */
function onFilesSelected(event) {
  var files = Array.from(event.target.files);
  if (!files.length) return;

  var totalSelected = selectedFiles.length + files.length;
  var totalUploaded = uploadedCount;

  // slot check
  var slotsLeft = MAX_IMAGES - totalUploaded - selectedFiles.length;
  if (slotsLeft <= 0) {
    showMessage("Maximum " + MAX_IMAGES + " images allowed. You have already filled the quota.", "error");
    fileInput.value = "";
    return;
  }
  files = files.slice(0, slotsLeft);

  // size check (pending + what's already uploaded)
  var pendingBytes = selectedFiles.reduce(function(s,f){ return s+f.size; },0);
  var remainingBytes = MAX_BYTES - uploadedBytes - pendingBytes;
  var toAdd = [];
  for (var i = 0; i < files.length; i++) {
    if (files[i].size > remainingBytes) {
      showMessage("Adding \"" + files[i].name + "\" would exceed the 20MB total limit. Skipped.", "error");
      continue;
    }
    toAdd.push(files[i]);
    remainingBytes -= files[i].size;
  }
  selectedFiles = selectedFiles.concat(toAdd);
  fileInput.value = "";
  renderPreviews();
  updateQuota();
  btnUploadOnly.disabled = (selectedFiles.length === 0);
  uploadBox.classList.remove("has-error");
}

function renderPreviews() {
  previewGrid.innerHTML = "";
  selectedFiles.forEach(function(file, idx) {
    var div = document.createElement("div");
    div.className = "preview-item";
    var img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    var btn = document.createElement("button");
    btn.className = "remove-btn";
    btn.textContent = "✕";
    btn.onclick = function(e) { e.stopPropagation(); removeFile(idx); };
    div.appendChild(img);
    div.appendChild(btn);
    previewGrid.appendChild(div);
  });
}

function removeFile(idx) {
  selectedFiles.splice(idx, 1);
  renderPreviews();
  updateQuota();
  btnUploadOnly.disabled = (selectedFiles.length === 0);
}

function updateQuota() {
  var pendingBytes = selectedFiles.reduce(function(s,f){ return s+f.size; },0);
  var totalBytes   = uploadedBytes + pendingBytes;
  var totalCount   = uploadedCount + selectedFiles.length;

  if (totalCount === 0 && uploadedCount === 0) {
    quotaWrap.style.display = "none";
    uploadStatus.textContent = "";
    return;
  }

  quotaWrap.style.display = "block";
  var pctSize  = Math.min((totalBytes / MAX_BYTES) * 100, 100);
  quotaFill.style.width = pctSize + "%";

  var totalMB  = (totalBytes / (1024 * 1024)).toFixed(2);
  var uploadedMB = (uploadedBytes / (1024*1024)).toFixed(2);

  countLabel.textContent = totalCount + " of " + MAX_IMAGES + " images";
  sizeLabel.textContent  = totalMB + " / " + MAX_MB + ".00 MB";

  // status line: show uploaded so far
  if (uploadedCount > 0) {
    var upMB = (uploadedBytes/(1024*1024)).toFixed(2);
    uploadStatus.textContent = "✅ " + uploadedCount + " uploaded (" + upMB + " MB used)";
    if (selectedFiles.length > 0) {
      uploadStatus.textContent += "  |  " + selectedFiles.length + " pending";
    }
  } else {
    uploadStatus.textContent = selectedFiles.length + " selected, ready to upload";
  }
}

/* ──────────────────────────────────────────
   Upload Images Only (independent button)
────────────────────────────────────────── */
function uploadImagesOnly() {
  if (isProcessing) return;
  if (selectedFiles.length === 0) { showMessage("Please select at least one image.", "error"); return; }
  if (!meetingId) { showMessage("Meeting not loaded. Please wait.", "error"); return; }
  isProcessing = true;
  btnUploadOnly.disabled = true;
  btnUploadOnly.innerHTML = '<span class="spinner spinner-dark"></span> Uploading…';
  uploadLog.innerHTML = "";

  var total = selectedFiles.length;
  var done  = 0;
  var ok    = 0;
  var filesToUpload = selectedFiles.slice();

  function uploadNext(i) {
    if (i >= filesToUpload.length) {
      isProcessing = false;
      btnUploadOnly.innerHTML = "⬆️ Upload Images";

      if (ok > 0) {
        uploadedCount += ok;
        uploadedBytes += filesToUpload.slice(0, ok).reduce(function(s){ return s; }, 0);
        // Recalculate uploadedBytes properly
        var successFiles = filesToUpload.filter(function(_,idx){ return idx < ok; });
        uploadedBytes = filesToUpload.reduce(function(s, f, idx) {
          return s; // we'll recompute below
        }, uploadedBytes);
        selectedFiles = [];
        renderPreviews();
        updateQuota();
        btnUploadOnly.disabled = true;
        var msg = ok + " of " + total + " image(s) uploaded successfully!";
        if (ok < total) msg += " (" + (total - ok) + " failed)";
        showMessage(msg, ok === total ? "success" : "info");
        uploadStatus.textContent = "✅ " + uploadedCount + " image(s) uploaded this session";
      } else {
        btnUploadOnly.disabled = false;
        showMessage("All uploads failed. Please try again.", "error");
      }
      return;
    }

    var file = filesToUpload[i];
    var logItem = document.createElement("div");
    logItem.className = "upload-log-item";
    logItem.textContent = "⏳ Uploading " + (i+1) + " of " + total + ": " + file.name + "…";
    uploadLog.appendChild(logItem);
    uploadLog.scrollTop = uploadLog.scrollHeight;

    // Update status during upload
    uploadStatus.textContent = "Uploading " + (i+1) + " of " + total + "…";

    var reader = new FileReader();
    reader.onload = function(e) {
      var base64 = e.target.result.split(",")[1];
      ZOHO.CRM.API.attachFile({
        Entity: "Events",
        RecordID: meetingId,
        File: { Name: file.name, Content: base64 }
      }).then(function(res) {
        if (res && res.data && res.data[0] && res.data[0].code === "SUCCESS") {
          ok++;
          uploadedBytes += file.size;
          logItem.className = "upload-log-item ok";
          logItem.textContent = "✅ " + (i+1) + " of " + total + ": " + file.name;
        } else {
          logItem.className = "upload-log-item fail";
          logItem.textContent = "❌ " + (i+1) + " of " + total + ": " + file.name + " (failed)";
        }
        done++;
        uploadNext(i + 1);
      }).catch(function() {
        logItem.className = "upload-log-item fail";
        logItem.textContent = "❌ " + (i+1) + " of " + total + ": " + file.name + " (error)";
        done++;
        uploadNext(i + 1);
      });
    };
    reader.readAsDataURL(file);
  }
  uploadNext(0);
}

/* ──────────────────────────────────────────
   Mark meeting action
────────────────────────────────────────── */
function processMeetingAction(targetStage) {
  if (isProcessing) return;

  // Validate purpose
  var purpose = purposeEl.value.trim();
  if (!purpose) {
    purposeEl.classList.add("has-error");
    showMessage("Please select a Meeting Purpose.", "error");
    purposeEl.scrollIntoView({ behavior: "smooth" }); return;
  }
  purposeEl.classList.remove("has-error");

  // Validate type
  var mType = typeEl.value.trim();
  if (!mType) {
    typeEl.classList.add("has-error");
    showMessage("Please select a Meeting Type.", "error");
    typeEl.scrollIntoView({ behavior: "smooth" }); return;
  }
  typeEl.classList.remove("has-error");

  // Validate description
  var desc = descEl.value.trim();
  if (!desc) {
    descEl.classList.add("has-error");
    showMessage("Please enter a Description.", "error");
    descEl.scrollIntoView({ behavior: "smooth" }); return;
  }
  descEl.classList.remove("has-error");

  // Image validation: mandatory only for Demo/Training + Completed
  var imageMandatory = (purpose === "Demo" || purpose === "Training") && targetStage === STAGE_COMPLETED;
  var hasImages = (uploadedCount > 0) || (selectedFiles.length > 0);

  if (imageMandatory && !hasImages) {
    uploadBox.classList.add("has-error");
    showMessage("Please upload at least 1 image for Demo/Training meetings marked as Completed.", "error");
    uploadBox.scrollIntoView({ behavior: "smooth" }); return;
  }
  uploadBox.classList.remove("has-error");

  // If there are pending (not yet uploaded) selected files, upload them first then mark
  if (selectedFiles.length > 0) {
    isProcessing = true;
    disableAllButtons();
    showMessage("Uploading images, then marking as " + targetStage + "…", "info");
    uploadAndThenMark(targetStage, desc, purpose, mType);
    return;
  }

  // No pending files — just mark
  doMarkMeeting(targetStage, desc, purpose, mType);
}

function uploadAndThenMark(targetStage, desc, purpose, mType) {
  var filesToUpload = selectedFiles.slice();
  var total = filesToUpload.length;
  var ok = 0;

  uploadLog.innerHTML = "";
  uploadStatus.textContent = "Uploading images…";

  function uploadNext(i) {
    if (i >= filesToUpload.length) {
      if (ok > 0) {
        uploadedCount += ok;
        selectedFiles = [];
        renderPreviews();
        updateQuota();
      }
      isProcessing = false;
      doMarkMeeting(targetStage, desc, purpose, mType);
      return;
    }
    var file = filesToUpload[i];
    var logItem = document.createElement("div");
    logItem.className = "upload-log-item";
    logItem.textContent = "⏳ " + (i+1) + "/" + total + ": " + file.name;
    uploadLog.appendChild(logItem);
    uploadStatus.textContent = "Uploading " + (i+1) + " of " + total + "…";

    var reader = new FileReader();
    reader.onload = function(e) {
      var base64 = e.target.result.split(",")[1];
      ZOHO.CRM.API.attachFile({
        Entity: "Events",
        RecordID: meetingId,
        File: { Name: file.name, Content: base64 }
      }).then(function(res) {
        if (res && res.data && res.data[0] && res.data[0].code === "SUCCESS") {
          ok++;
          uploadedBytes += file.size;
          logItem.className = "upload-log-item ok";
          logItem.textContent = "✅ " + (i+1) + "/" + total + ": " + file.name;
        } else {
          logItem.className = "upload-log-item fail";
          logItem.textContent = "❌ " + (i+1) + "/" + total + ": " + file.name;
        }
        uploadNext(i + 1);
      }).catch(function() {
        logItem.className = "upload-log-item fail";
        logItem.textContent = "❌ " + (i+1) + "/" + total + ": " + file.name;
        uploadNext(i + 1);
      });
    };
    reader.readAsDataURL(file);
  }
  uploadNext(0);
}

function doMarkMeeting(targetStage, desc, purpose, mType) {
  isProcessing = true;
  disableAllButtons();
  showMessage("Marking meeting as " + targetStage + "…", "info");

  var now = new Date().toISOString();
  var updateData = {};
  updateData[FIELD_STAGE]     = targetStage;
  updateData[FIELD_PURPOSE]   = purpose;
  updateData[FIELD_TYPE]      = mType;
  updateData[FIELD_DESC]      = desc;
  updateData[FIELD_ACTION_DT] = now;

  // GPS
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos) {
      updateData[FIELD_LOCATION] = "https://www.google.com/maps?q=" + pos.coords.latitude + "," + pos.coords.longitude;
      pushUpdate(updateData, targetStage);
    }, function() {
      pushUpdate(updateData, targetStage);
    }, { timeout: 5000 });
  } else {
    pushUpdate(updateData, targetStage);
  }
}

function pushUpdate(data, targetStage) {
  ZOHO.CRM.getCurrentUser().then(function(user) {
    if (user && user.users && user.users[0]) {
      data[FIELD_MARKED_BY] = user.users[0].full_name || user.users[0].email || "";
    }
    ZOHO.CRM.API.updateRecord({
      Entity: "Events",
      APIData: Object.assign({ id: meetingId }, data),
      Trigger: []
    }).then(function(res) {
      isProcessing = false;
      if (res && res.data && res.data[0] && res.data[0].code === "SUCCESS") {
        showMessage("✅ Meeting marked as " + targetStage + " successfully!", "success");
        disableAllButtons();
        stageDisplay.textContent = targetStage;
        setTimeout(function() { ZOHO.CRM.UI.Popup.closeReload(); }, 2000);
      } else {
        enableAllButtons();
        showMessage("Update failed. Please try again.", "error");
      }
    }).catch(function(err) {
      isProcessing = false;
      enableAllButtons();
      showMessage("Error updating meeting: " + (err && err.message ? err.message : "Unknown error"), "error");
    });
  }).catch(function() {
    ZOHO.CRM.API.updateRecord({
      Entity: "Events",
      APIData: Object.assign({ id: meetingId }, data),
      Trigger: []
    }).then(function(res) {
      isProcessing = false;
      if (res && res.data && res.data[0] && res.data[0].code === "SUCCESS") {
        showMessage("✅ Meeting marked as " + targetStage + " successfully!", "success");
        disableAllButtons();
        stageDisplay.textContent = targetStage;
        setTimeout(function() { ZOHO.CRM.UI.Popup.closeReload(); }, 2000);
      } else {
        enableAllButtons();
        showMessage("Update failed.", "error");
      }
    }).catch(function() {
      isProcessing = false;
      enableAllButtons();
      showMessage("Error updating meeting.", "error");
    });
  });
}

/* ── Helpers ── */
function disableAllButtons() {
  document.getElementById("btnComplete").disabled  = true;
  document.getElementById("btnCancel").disabled    = true;
  document.getElementById("btnPostpone").disabled  = true;
}
function enableAllButtons() {
  document.getElementById("btnComplete").disabled  = false;
  document.getElementById("btnCancel").disabled    = false;
  document.getElementById("btnPostpone").disabled  = false;
}

function showMessage(msg, type) {
  toastMsg.textContent = msg;
  toastMsg.className   = type;
  toastMsg.style.display = "block";
  if (type === "success") {
    setTimeout(function() { toastMsg.style.display = "none"; }, 4000);
  }
}

/* ──────────────────────────────────────────
   Zoho SDK Init
────────────────────────────────────────── */
ZOHO.embeddedApp.on("PageLoad", function(data) {
  meetingId = data.EntityId || (data.data && data.data.EntityId);
  if (!meetingId) {
    stageDisplay.textContent = "Error";
    showMessage("Could not load Meeting ID. Please close and reopen.", "error");
    return;
  }

  ZOHO.CRM.API.getRecord({ Entity: "Events", RecordID: meetingId })
    .then(function(res) {
      if (!res || !res.data || !res.data[0]) {
        stageDisplay.textContent = "Not Found";
        showMessage("Meeting not found.", "error"); return;
      }
      var meeting = res.data[0];
      currentStage = meeting[FIELD_STAGE] || "";
      stageDisplay.textContent = currentStage || "Not Set";

      if (meeting[FIELD_PURPOSE]) { purposeEl.value = meeting[FIELD_PURPOSE]; updateImageLabel(); }
      if (meeting[FIELD_TYPE])    { typeEl.value    = meeting[FIELD_TYPE]; }
      if (meeting[FIELD_DESC])    { descEl.value    = meeting[FIELD_DESC]; }

      if (currentStage === STAGE_COMPLETED) {
        disableAllButtons();
        showMessage("This Meeting is already Completed. You can still upload images.", "info"); return;
      }
      if (currentStage === STAGE_CANCELLED) {
        disableAllButtons();
        showMessage("This Meeting is already Cancelled. You can still upload images.", "info"); return;
      }
      if (currentStage === STAGE_POSTPONED) {
        disableAllButtons();
        showMessage("This Meeting is already Postponed. You can still upload images.", "info"); return;
      }
      enableAllButtons();
    })
    .catch(function(err) {
      stageDisplay.textContent = "Error";
      showMessage(err && err.message ? err.message : "Unable to load Meeting.", "error");
    });
});

ZOHO.embeddedApp.init();
</script>

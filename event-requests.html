<!DOCTYPE html>

<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --ink:#18202E; --muted:#5B6578; --line:#DCE1E8; --line-soft:#EBEEF2;
  --gtm:#1F6F78; --gtm-soft:#E4F1F2; --mkt:#3A47A8; --mkt-soft:#E8EAF7;
  --up:#A33A2B; --up-soft:#F8E6E3; --down:#2D7A4B; --down-soft:#E3F2E8; --focus:#3A47A8;
  --field:#FFFFFF; --field-off:#F1F3F6;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12161D; --surface:#1A2029; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2E3644; --line-soft:#252C38;
  --gtm:#5FB7C0; --gtm-soft:#1C3236; --mkt:#8E98E8; --mkt-soft:#232848;
  --up:#E8857A; --up-soft:#3A2420; --down:#72C493; --down-soft:#1C3326; --focus:#8E98E8;
  --field:#141920; --field-off:#1F2530; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12161D; --surface:#1A2029; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2E3644; --line-soft:#252C38;
  --gtm:#5FB7C0; --gtm-soft:#1C3236; --mkt:#8E98E8; --mkt-soft:#232848;
  --up:#E8857A; --up-soft:#3A2420; --down:#72C493; --down-soft:#1C3326; --focus:#8E98E8;
  --field:#141920; --field-off:#1F2530; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:20px 20px 120px}
h1{font-size:24px;line-height:1.25;margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 4px;font-weight:600}
p{margin:0}
.sub{color:var(--muted);font-size:13.5px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.demo{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:13.5px}
.demo .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.demo .seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer}
.demo .seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.linkbtn{border:0;background:none;color:var(--mkt);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}

.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;background:var(--surface);white-space:nowrap}
.chip b{font-weight:600}
.you-gtm{border-color:var(--gtm);color:var(--gtm)}
.you-mkt{border-color:var(--mkt);color:var(--mkt)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
.panel-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}

.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cat{border:1px solid var(--line);border-radius:8px;background:var(--field);padding:14px;text-align:left;cursor:pointer}
.cat strong{display:block;font-weight:600}
.cat span{font-size:13px;color:var(--muted)}
.cat[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cat:disabled{cursor:default}
.subtypes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{border:1px solid var(--line);border-radius:20px;background:var(--field);padding:6px 14px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.auto-note{margin-top:12px;font-size:13.5px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 16px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}
label.f{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
label.f i{font-style:normal;color:var(--up)}
.in{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:8px 10px;min-height:38px}
.in:disabled,.in[readonly]{background:var(--field-off);color:var(--muted)}
textarea.in{min-height:72px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.hint.err{color:var(--up)}
.hint.ok{color:var(--down)}
.owner{display:flex;align-items:center;gap:8px;min-height:38px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--field-off)}
.owner .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.owner.found .dot{background:var(--down)}
.typeahead{position:relative}
.ta-list{position:absolute;z-index:5;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:6px;max-height:200px;overflow:auto;list-style:none;padding:4px;margin-left:0}
.ta-list li button{width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:4px;cursor:pointer}
.ta-list li button:hover{background:var(--field-off)}

/* Negotiation ledger */
.ledger-wrap{overflow-x:auto}
table.ledger{width:100%;border-collapse:collapse;min-width:640px}
.ledger th,.ledger td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;text-align:left}
.ledger thead th{font-size:13px;font-weight:600;border-bottom:1px solid var(--line)}
.ledger thead th.gtm{color:var(--gtm);background:var(--gtm-soft)}
.ledger thead th.mkt{color:var(--mkt);background:var(--mkt-soft)}
.ledger td.gtm{background:color-mix(in srgb,var(--gtm-soft) 45%,transparent)}
.ledger td.mkt{background:color-mix(in srgb,var(--mkt-soft) 45%,transparent)}
.ledger th[scope="row"]{font-weight:500;width:24%}
.ledger th[scope="row"] small{display:block;font-weight:400;color:var(--muted);font-size:12px;line-height:1.35}
.ledger .in{min-width:0}
.ledger tr.total th,.ledger tr.total td{font-weight:600;border-bottom:0}
.ledger tr.commit th,.ledger tr.commit td{font-weight:600}
.money{position:relative}
.money::before{content:"₹";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.money .in{padding-left:24px;text-align:right}
.diff{display:inline-block;font-size:12.5px;border-radius:4px;padding:2px 7px;white-space:nowrap}
.diff.same{color:var(--muted)}
.diff.up{color:var(--up);background:var(--up-soft)}
.diff.down{color:var(--down);background:var(--down-soft)}
.static{min-height:38px;display:flex;align-items:center}
.filecell{font-size:13px}
.filecell input{max-width:100%;font-size:13px}
.legend{font-size:13px;color:var(--muted)}

/* Sample draft — the proposal sheet approvers see */
.sheet-wrap{overflow-x:auto}
table.sheet{width:100%;border-collapse:collapse;min-width:640px;font-size:14px}
.sheet th,.sheet td{border:1px solid var(--ink);padding:8px 10px;vertical-align:middle}
.sheet thead th{font-weight:600;text-align:center}
.sheet td.ev{font-weight:600}
.sheet td.num{text-align:right}
.sheet td.ctr{text-align:center}
.sheet td.commit{font-size:20px;font-weight:700;text-align:center}
.sheet small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.sheet tfoot td{font-weight:600}

.remarks{margin-top:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:1040px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar .msg{font-size:13.5px;color:var(--muted);max-width:560px}
.bar .msg.err{color:var(--up)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 16px;font-weight:500;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.reject{background:var(--up);border-color:var(--up);color:#fff}
.btn.approve{background:var(--down);border-color:var(--down);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:6px;font-size:14px;z-index:20}

@media (max-width:560px){
  .cats{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr}
  .c2,.c3,.c4,.c6{grid-column:span 2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.form-grid .full{grid-column:1/-1}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.summary div{background:var(--field-off);border-radius:8px;padding:12px}
.summary span{display:block;font-size:12.5px;color:var(--muted)}
.summary b{font-size:18px;font-weight:600}
.note{font-size:13px;color:var(--muted);background:var(--field-off);border-radius:6px;padding:8px 12px;margin-bottom:14px}
.note.warn{color:var(--up);background:var(--up-soft)}
.side-gtm{border-color:var(--gtm)!important;color:var(--gtm)!important}
@media (max-width:560px){.form-grid,.summary{grid-template-columns:1fr}.listhead .btn{width:100%}.bar .btns{width:100%}.bar .btn{flex:1}}
/* ---------- list, options, info ---------- */
.info{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 16px}
.info div span{display:block;font-size:12.5px;color:var(--muted)}
.info div b{font-weight:500}
.opt{display:flex;flex-wrap:wrap;gap:6px}
.opt button{border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);padding:6px 12px;cursor:pointer;font-size:13.5px}
.opt button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cellnote{font-size:12px;color:var(--muted);margin-top:4px}
.listhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.filters .in{max-width:300px}
table.list{width:100%;border-collapse:collapse;min-width:720px}
.list th,.list td{padding:10px 12px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:middle;font-size:14px}
.list thead th{font-size:13px;font-weight:600;border-bottom:1px solid var(--line)}
.list tbody tr:hover{background:var(--field-off)}
.list .open{border:0;background:none;padding:0;color:var(--mkt);font:inherit;font-weight:600;cursor:pointer;text-align:left}
.list .open:hover{text-decoration:underline}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:13.5px;color:var(--muted)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.back{margin-bottom:10px;display:inline-block}
.listhead + .panel{margin-top:0}
/* ---------- phones ---------- */
@media (max-width:560px){
  .wrap{padding:14px 12px 140px}
  h1{font-size:20px}
  .panel{padding:14px;border-radius:8px}
  .head,.listhead{flex-direction:column;align-items:stretch;gap:10px}
  .listhead .btn{width:100%;padding:12px}
  .chips{gap:4px}
  .info{grid-template-columns:1fr 1fr;gap:10px}
  .listhead{margin-bottom:12px}
  .form-grid,.summary{grid-template-columns:1fr}
  .in,select.in,textarea.in{font-size:16px;min-height:44px}          /* stops iPhone zoom on focus */
  .opt{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  .opt button{flex:0 0 auto;padding:9px 12px;min-height:40px}
  .form-grid .opt{flex-wrap:wrap;overflow:visible}
  .form-grid .opt button{flex:1 1 auto}
  .filters{flex-direction:column;align-items:stretch}
  .filters .in{max-width:none}
  .filters .opt{max-width:100%;min-width:0;width:100%}
  .wrap,.panel{min-width:0;max-width:100%}
  /* list becomes cards */
  table.list{min-width:0}
  .list thead{display:none}
  .list tbody tr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .list tbody td{display:block;padding:0;border:0;font-size:13.5px}
  .list td[data-l="event"]{grid-column:1 / -1;order:-2;font-size:15px}
  .list td[data-l="no"]{order:-1;color:var(--muted)}
  .list td[data-l="status"]{text-align:right}
  .list td[data-l="date"],.list td[data-l="owner"],.list td[data-l="tag"]{color:var(--muted)}
  .list td.empty{grid-column:1 / -1}
  .pager{flex-direction:column;align-items:stretch}
  .pager span:last-child{display:flex;gap:8px}.pager .btn{flex:1}
  .bar{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
  .bar-in{flex-direction:column;align-items:stretch;gap:8px}
  .bar .msg{font-size:13px}
  .bar .btns{display:flex;gap:8px}.bar .btn{flex:1;padding:12px 10px}
  .toast{bottom:120px;max-width:90vw;text-align:center}
  .ta-list{max-height:180px}
}

textarea.in{min-height:58px}
label.f,.f{display:block;font-size:12.5px;font-weight:500;margin-bottom:3px;color:var(--muted)}

.money .in{padding-left:22px}
.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 14px}
.s1{grid-column:span 1}.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}
h2.sec{font-size:14px;font-weight:600;margin:4px 0 8px}
h2.sec + .fgrid{margin-bottom:14px}
.fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}
.fh-left{min-width:0}.fh-left h1{font-size:19px;margin-top:2px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 12px}
.tab{border:0;background:none;color:var(--muted);padding:8px 14px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}

.tl li::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--mkt)}
.tl li:last-child{padding-bottom:0}
.tl .who{font-size:13.5px;font-weight:500}.tl .when{font-size:12.5px;color:var(--muted)}
.tl .chg{font-size:13px;margin-top:4px;color:var(--ink)}.tl .chg span{color:var(--muted)}
.bar-in{flex-wrap:nowrap}.bar .btns{flex-wrap:nowrap;flex-shrink:0}.bar .btn{padding:8px 16px;white-space:nowrap}
@media (max-width:620px){

}

<style>
.cost-block{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.cost-block h3{font-size:13.5px;font-weight:600;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.lock{font-size:11.5px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.check{display:flex;align-items:center;gap:8px;min-height:34px;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px}
.routes{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:14px}
.done{max-width:460px;margin:40px auto;text-align:center}
.done .tick{width:84px;height:84px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--cost) 16%,transparent)}
.done .tick svg{width:44px;height:44px}
.done .tick path{stroke:var(--cost);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .15s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.done .tick path{animation:none;stroke-dashoffset:0}}
.done h1{font-size:20px;margin-bottom:6px}.done .rec{font-size:16px;font-weight:600;margin:10px 0 2px}.done .num{color:var(--muted);font-size:13.5px}
.done .next{font-size:13.5px;color:var(--muted);margin:14px 0 22px}
.done .btns{justify-content:center}
.cmp td{padding:4px 10px 4px 0;font-size:13px}.cmp td:first-child{color:var(--muted)}
.detrow{display:grid;grid-template-columns:max-content 86px max-content 86px minmax(86px,1fr);gap:8px 14px;align-items:end;margin-top:10px}
.detrow > div{min-width:0;grid-column:auto!important}.detrow .check{white-space:nowrap}.detrow label.f{white-space:nowrap}
.detrow .in:disabled{opacity:.5}
@media (max-width:620px){.detrow{grid-template-columns:auto 84px}}
.cost4{grid-template-columns:repeat(4,minmax(0,1fr))!important}.cost4 > div{grid-column:auto!important}
.lblrow{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:3px}.lblrow label.f{margin:0}
.mini{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.mini button{border:0;background:transparent;color:var(--muted);font-size:11.5px;line-height:1;padding:3px 7px;cursor:pointer}
.mini button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
@media (max-width:620px){.cost4{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
.cost4 label.f{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="wrap">
  <div id="demoBar" class="demo hidden" role="region" aria-label="Preview"><span>Preview mode, no CRM connection. View as: add <b>?as=gtm</b>, <b>?as=bh</b> or <b>?as=founder</b> to the address.</span> <button type="button" class="linkbtn" id="resetDemo">Start over</button></div>

  <section id="listView" aria-label="Event requests">
    <div class="panel">
      <div class="toprow">
        <label class="hidden" for="q">Search</label>
        <input class="in" id="q" type="search" placeholder="Search event name or number" autocomplete="off">
        <button type="button" class="btn primary" id="newBtn">+ New request</button>
      </div>
      <div class="opt filters-row" role="group" aria-label="Filter" id="filterBtns"></div>
      <table class="list" id="list"></table>
      <div class="pager"><span id="pageInfo"></span><span><button type="button" class="btn" id="prevPg">Previous</button> <button type="button" class="btn" id="nextPg">Next</button></span></div>
    </div>
  </section>

  <div id="formView" class="hidden">
    <div class="fhead">
      <div class="fh-left">
        <button type="button" class="linkbtn back" id="backBtn">← All requests</button>
        <h1 id="title">New request</h1>
        <p class="sub" id="subtitle">Domestic Event</p>
      </div>
      <div class="fh-mid" id="mid"></div>
      <div class="fh-right"><div class="chips" id="chips"></div><dl class="meta" id="meta"></dl></div>
    </div>
    <div id="notes"></div>
    <section class="panel hidden" id="remarksPanel" aria-labelledby="remH">
      <h2 id="remH" style="margin-bottom:4px">Remarks</h2>
      <p class="sub" id="remHint" style="margin-bottom:8px"></p>
      <label class="hidden" for="remarks">Remarks</label>
      <textarea class="in" id="remarks"></textarea>
      <div id="routeBox"></div>
    </section>
    <div class="tabs" role="tablist" aria-label="Request sections" id="tabs"></div>
    <section class="panel tabpanel" id="tab-event" role="tabpanel">
      <h2 class="sec">Event type</h2><div class="fgrid" id="secType"></div>
      <h2 class="sec" id="basicH">Basic details</h2><div class="fgrid" id="secBasic"></div>
    </section>
    <section class="panel tabpanel hidden" id="tab-cost" role="tabpanel">
      <div id="costBlocks"></div>
      <div class="summary" id="summary"></div>
      <p class="foot" id="foot"></p>
      <h2 class="sec" id="sheetH" style="margin-top:16px">Sample draft</h2>
      <div class="sheet-wrap" id="sheet"></div>
    </section>
    <section class="panel tabpanel hidden" id="tab-time" role="tabpanel"><div id="timeline"></div></section>
  </div>

  <section id="doneView" class="hidden" aria-live="polite">
    <div class="done">
      <div class="tick"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M13 25l7 7 15-16"/></svg></div>
      <h1 id="doneTitle">Request submitted</h1>
      <p class="rec" id="doneName"></p>
      <p class="num" id="doneNum"></p>
      <p class="next" id="doneNext"></p>
      <div class="btns"><button type="button" class="btn" id="doneView1">View request</button><button type="button" class="btn primary" id="doneBack">Back to all requests</button></div>
    </div>
  </section>
</div>

<div class="bar hidden" id="bar" role="region" aria-label="Actions">
  <div class="bar-in"><p class="msg" id="msg" aria-live="polite"></p><div class="btns" id="btns"></div></div>
</div>
<div class="toast hidden" id="toast" role="status"></div>

<script>
/* ================= CONFIG ================= */
const CFG = {
  MODULE:"Marketing_Events", PINCODE_MODULE:"Pincodes", DISTRICT_MODULE:"District", CITY_MODULE:"Cities", ACCOUNT_MODULE:"Accounts",
  MAP_FIELD:"Google_Map_Location",
  CAC:2000, FOUNDER_LIMIT:50000, PARTNER_MULTIPLIER:100,
  MARKETING_KEYWORDS:["marketing"],
  MARKETING_EMAILS:["amit.prasad@teachmint.com"],
  BH_USER:"681278000000439001",        // Venkata Aditya (AV)
  FOUNDER_USER:"681278000000314001",   // Sales-Ops (Divyansh)
  ZH_BY_ZONE:{"North 1":{id:"681278000000676466",name:"Vivek Mishra"},"East":{id:"681278000000676466",name:"Vivek Mishra"},"North 2":{id:"681278000000676433",name:"Suraj Agrahari"},"South":{id:"681278000000813134",name:"Swapnil Omprakash Mandhana"},"West":{id:"681278000000676418",name:"Hariom Shivhare"}},
  TAG:{ ZH_SEND:"Send to ZH Approval", ZH_PEND:"Pending ZH Approval", ZH_OK:"Approved by ZH", ZH_NO:"Rejected by ZH",
        BH_SEND:"Send to BH Approval", BH_PEND:"Pending BH Approval", BH_OK:"Approved by BH", BH_NO:"Rejected by BH",
        FD_SEND:"Send to Founder's Approval", FD_PEND:"Pending Founder's Approval", FD_OK:"Approved by Founders", FD_NO:"Rejected by Founders" },
  STATUS:{ DRAFT:"Draft", SUBMITTED:"Submitted", REJECTED:"Rejected", RESUBMITTED:"Resubmitted", APPROVED:"Approved" },
  SHARE:{ PCT:"Percentage (%)", AMT:"Amount (in Rs)" }
};
const C = {status:"Status", tag:"Event_Tag", remarks:"Rejection_Remarks", rejBy:"Rejected_by", team:"Raised_by_Team", district:"District", zh:"ZH", raisedBy:"Raised_by", number:"Event_Number", sub:"Sub_Source_ID",
  zhAck:"ZH_Acknowledged", zhOn:"ZH_Approved_On", bhAck:"BH_Acknowledged", bhOn:"BH_Approved_On", fdAck:"Founder_Acknowledged", fdOn:"Founder_Approved_On"};
const T = CFG.TAG, ST = CFG.STATUS;
const ATTENDEE = ["25 + KDMs","50 + KDMs","100 + KDMs","150 + KDMs","200 + KDMs","250 + KDMs","400 + KDMs","500 + KDMs"];
const COUNTRIES = ["India","Phillipines","Saudi Arabia"];
const CATS = ["End Customer Event","Partner Event","Partner Branding"], EC_SUBS = ["Sponsored Event","Co-Sponsored Event"];
const isPE = ()=>V.cat==="Partner Event", isBR = ()=>V.cat==="Partner Branding", isCO = ()=>V.sub==="Co-Sponsored Event";
const EV = ()=>!isBR();
const needPartner = ()=>isPE()||isCO();

/* gtm:true → also on the GTM short form. Every other field is Marketing-only. Branding fields show to both. */
const FIELDS = [
  {sec:"secType", k:"cat", label:"Event category", api:"Event_Category", type:"category", req:true, gtm:true},
  {sec:"secType", k:"sub", label:"Event sub type", api:"Event_Sub_Type", type:"subtype", req:true, gtm:true, show:()=>V.cat && !isBR()},
  {sec:"secType", k:"date", label:"Event date", api:"Event_Date", type:"date", req:true, gtm:true, show:EV},
  {sec:"secBasic", k:"partner", label:"Partner name", api:"Partner", type:"partner", req:true, gtm:true, show:needPartner},
  {sec:"secBasic", k:"pcontrib", label:"Partner contribution", api:"Partner_s_Contribution", type:"money", req:true, show:isCO},
  {sec:"secBasic", k:"name", label:"Event name", api:"Name", type:"text", req:true, gtm:true, ph:"e.g. Education Excellence Conclave – Jammu", show:EV},
  {sec:"secBasic", k:"attendee", label:"Expected attendee", api:"Expected_Attendee", type:"select", options:ATTENDEE, req:true, gtm:true, show:EV},
  {sec:"secBasic", k:"address", label:"Venue", api:"Address", type:"textarea", req:true, show:EV},
  {sec:"secBasic", k:"city", label:"City", api:"City", type:"citylk", req:true, gtm:true, show:EV},
  {sec:"secBasic", k:"state", label:"State", api:"State", type:"auto", req:true, gtm:true, show:EV},
  {sec:"secBasic", k:"pin", label:"Pin code", api:"Pin_Code", type:"pinlk", req:true, gtm:true, show:EV},
  {sec:"secBasic", k:"country", label:"Country", api:"Country", type:"select", options:COUNTRIES, req:true, gtm:true, show:EV},
  {sec:"secBasic", k:"agenda", label:"Event proposal", api:"Event_Agenda", type:"file", req:true, gtm:true, show:EV},
  {sec:"secBasic", k:"photos", label:"Other attachments", api:"Photographs", type:"file", multiple:true, show:EV},
  {sec:"secBasic", k:"other", label:"Additional event details", api:"Other_Details", type:"textarea", show:EV},
  // Partner Branding
  {sec:"secBasic", k:"firm", label:"Firm name", api:"Firm_Name", type:"lookup", req:true, br:true, show:isBR},
  {sec:"secBasic", k:"logo", label:"Firm logo", api:"Logo", type:"file", accept:"image/*", br:true, show:isBR},
  {sec:"secBasic", k:"poc", label:"Firm POC name", api:"Partner_POC_Name", type:"text", req:true, br:true, show:isBR},
  {sec:"secBasic", k:"pocm", label:"Firm mobile number", api:"POC_Mobile_Number", type:"phone", req:true, br:true, show:isBR},
  {sec:"secBasic", k:"faddr", label:"Firm address", api:"Firm_Address", type:"textarea", req:true, br:true, show:isBR},
  {sec:"secBasic", k:"fpin", label:"Zip code", api:"Zip_Code", type:"pinlk", req:true, br:true, show:isBR},
  {sec:"secBasic", k:"fcity", label:"City", api:"City1", type:"citylk", req:true, br:true, show:isBR},
  {sec:"secBasic", k:"fstate", label:"State", api:"State1", type:"auto", req:true, br:true, show:isBR},
  {sec:"secBasic", k:"map", label:"Google Map location", api:"Google_Map_Location", type:"map", br:true, show:isBR},
  {sec:"secBasic", k:"more", label:"Additional details", api:"More_Details", type:"textarea", br:true, show:isBR},
  {sec:"brVendor", k:"recce", label:"Site recce report", api:"Site_recce_Report", type:"file", br:true, show:isBR},
  {sec:"brVendor", k:"vendor", label:"Vendor name", api:"Vendor_Name", type:"text", req:true, br:true, show:isBR},
  {sec:"brVendor", k:"quote", label:"Quoted amount", api:"Quoted_Amount", type:"money", req:true, br:true, show:isBR},
  // Initial cost (first proposal)
  {sec:"init", k:"spons", label:"Sponsorship cost", api:"Sponsorship_Cost", type:"money", req:true, gtm:true, show:EV},
  {sec:"init", k:"ishare", label:"TM share", type:"share", req:true, set:"init", show:isPE},
  {sec:"init", k:"prod", label:"Production cost", api:"Production_Cost", type:"money", req:true, help:"Booth branding, standees, branding", show:EV},
  {sec:"init", k:"proc", label:"Procurement cost", api:"Procurement_Cost", type:"money", req:true, help:"Brochures, merchandise, bags, gifts", show:EV},
  {sec:"init", k:"gift", label:"Gift’s required", api:"Gift_s_Required", type:"check", gtm:true, show:EV},
  {sec:"init", k:"giftc", label:"Gift count", api:"Gift_s_Count", type:"count", req:()=>!!V.gift, show:EV, needs:"gift"},
  {sec:"init", k:"merch", label:"Merchandise required", api:"Merchandise_Required", type:"check", gtm:true, show:EV},
  {sec:"init", k:"merchc", label:"Merch count", api:"Merchandise_s_Count", type:"count", req:()=>!!V.merch, show:EV, needs:"merch"},
  {sec:"init", k:"broc", label:"Brochures", api:"Brochure_s_Count", type:"count", req:true, show:EV},
  // Final cost (negotiated, used in approvals)
  {sec:"final", k:"fspons", label:"Sponsorship cost", api:"Event_s_Sponsorship_Cost", type:"money", req:true, show:EV},
  {sec:"final", k:"fshare", label:"TM share", type:"share", req:true, set:"final", show:isPE},
  {sec:"final", k:"fprod", label:"Production cost", api:"Event_s_Production_Cost", type:"money", req:true, show:EV},
  {sec:"final", k:"fproc", label:"Procurement cost", api:"Event_s_Procurement_Cost", type:"money", req:true, show:EV}
];
const SHARE_API = { init:{type:"Share_Type", pct:"Teachmint_Share_Percent", amt:"Teachmint_Share_Amount"}, final:{type:"Final_Share_Type", pct:"Final_TM_Share_Percent", amt:"Final_TM_Share_Amount"} };
const W = {cat:2, sub:2, date:2, partner:4, pcontrib:2, name:4, attendee:2, address:6, city:2, state:2, pin:1, country:1, agenda:3, photos:3, other:6,
  firm:4, logo:2, poc:3, pocm:3, faddr:6, fpin:2, fcity:2, fstate:2, map:6, more:6, recce:6, vendor:3, quote:3,
  spons:2, ishare:4, prod:2, proc:2, gift:2, giftc:1, merch:2, merchc:1, broc:2, fspons:2, fshare:4, fprod:2, fproc:2};
const byK = k => FIELDS.find(f=>f.k===k);
const STATE_FIX = {"Andaman & Nicobar":"Andaman & Nicobar (UT)","Chandigarh":"Chandigarh (UT)","Jammu & Kashmir":"Jammu & Kashmir(UT)","Ladakh":"Ladakh (UT)","Lakshadweep":"Lakshadweep (UT)","Puducherry":"Puducherry (UT)"};
const toState = st => { const t = String(st||"").trim(); if(/^Uttar Pradesh\s*\d+$/i.test(t)) return "Uttar Pradesh"; return STATE_FIX[t] || t; };

/* ================= STATE ================= */
const S = {live:false, role:"MKT", user:{id:null,name:""}, recordId:null, rec:{}, files:{}, owner:null, zh:null, districtId:null, districtName:"",
  ownerDirty:false, busy:false, view:"list", tab:"event", tl:null, tlAll:false, share:{init:"%", final:"%"}, route:"zh", done:null};
let V = {};

/* ================= DATA (Zoho SDK or preview) ================= */
const MOCK = {
  partners:[{id:"a1",Account_Name:"Brightpath Learning Solutions",GST_Number:"01ABCDE1234F1Z5",UCI:"UCI-778"},{id:"a2",Account_Name:"Kashmir Edu Systems",GST_Number:"01KSHED4321K1Z2",UCI:"UCI-112"},{id:"a3",Account_Name:"Kanpur Smart Class (no GST)",GST_Number:"",UCI:"UCI-901"}],
  cities:[{id:"c1",Name:"Jammu",State:{name:"Jammu & Kashmir"}},{id:"c2",Name:"Bengaluru",State:{name:"Karnataka"}},{id:"c3",Name:"Kanpur",State:{name:"Uttar Pradesh"}}],
  pincodes:[{id:"p1",Name:"180001",District:{id:"d1",name:"Jammu"}},{id:"p2",Name:"180004",District:{id:"d1",name:"Jammu"}},{id:"p3",Name:"560001",District:{id:"d2",name:"Bengaluru Urban"}}],
  districts:[{id:"d1",name:"Jammu",zone:"North 1",owner:{id:"u1",name:"District owner, Jammu"}},{id:"d2",name:"Bengaluru Urban",zone:"South",owner:{id:"u2",name:"District owner, Bengaluru"}}],
  rows:[], n:0, hist:{}
};
const wait = ms => new Promise(r=>setTimeout(r,ms));
const API = {
  async me(){
    if(!S.live){ const a = new URLSearchParams(location.search).get("as"); const role = a==="gtm"?"GTM":a==="bh"?"BH":a==="founder"?"FD":"MKT";
      return {role, id: role==="BH"?CFG.BH_USER : role==="FD"?CFG.FOUNDER_USER : "me", name:{MKT:"Preview Marketing user",GTM:"Preview GTM user",BH:"Venkata Aditya (preview)",FD:"Sales-Ops (preview)"}[role]}; }
    const r = await ZOHO.CRM.CONFIG.getCurrentUser(); const u = (r&&r.users&&r.users[0])||{};
    const hay = (((u.role||{}).name||"")+" "+((u.profile||{}).name||"")).toLowerCase();
    let role = (CFG.MARKETING_KEYWORDS.some(w=>hay.includes(w)) || CFG.MARKETING_EMAILS.includes(String(u.email||"").toLowerCase())) ? "MKT" : "GTM";
    if(u.id===CFG.BH_USER) role = "BH"; if(u.id===CFG.FOUNDER_USER) role = "FD";
    return {role, id:u.id, name:u.full_name||""};
  },
  async list(f){
    if(!S.live){ await wait(120); return {rows:MOCK.rows.filter(r=>matches(r,f)).map(r=>structuredClone(r)), more:false}; }
    const crit = criteria(f);
    const r = crit ? await ZOHO.CRM.API.searchRecord({Entity:CFG.MODULE, Type:"criteria", Query:crit, page:f.page, per_page:20})
                   : await ZOHO.CRM.API.getAllRecords({Entity:CFG.MODULE, sort_order:"desc", page:f.page, per_page:20});
    return {rows:(r&&r.data)||[], more:!!(r&&r.info&&r.info.more_records)};
  },
  async load(id){
    if(!S.live) return structuredClone(MOCK.rows.find(r=>r.id===id)||{});
    const r = await ZOHO.CRM.API.getRecord({Entity:CFG.MODULE, RecordID:id}); return (r&&r.data&&r.data[0])||{};
  },
  async accounts(q, verified){
    let rows;
    if(!S.live){ await wait(120); rows = MOCK.partners.filter(p=>p.Account_Name.toLowerCase().includes(q.toLowerCase())); }
    else { const r = await ZOHO.CRM.API.searchRecord({Entity:CFG.ACCOUNT_MODULE, Type:"word", Query:q, per_page:50}); rows = (r&&r.data)||[]; }
    return verified ? rows.filter(p=>has(p.GST_Number) && has(p.UCI)) : rows;   // partners must have GST + UCI
  },
  async lookupSearch(kind,q){
    if(!S.live){ await wait(120); const src = kind==="city"?MOCK.cities:MOCK.pincodes; return src.filter(r=>r.Name.toLowerCase().startsWith(q.toLowerCase())).slice(0,20); }
    const mod = kind==="city"?CFG.CITY_MODULE:CFG.PINCODE_MODULE, t = q.replace(/[(),]/g,"\\$&");
    const r = await ZOHO.CRM.API.searchRecord({Entity:mod, Type:"criteria", Query:"(Name:starts_with:"+t+")", per_page:20}); return (r&&r.data)||[];
  },
  async district(id){
    if(!S.live) return MOCK.districts.find(d=>d.id===id)||null;
    const r = await ZOHO.CRM.API.getRecord({Entity:CFG.DISTRICT_MODULE, RecordID:id}); const d = r&&r.data&&r.data[0]; if(!d) return null;
    return {id:d.id, name:d.Name, zone:d.Zone||"", owner:d.Owner?{id:d.Owner.id,name:d.Owner.name}:null};
  },
  async timeline(id){
    if(!S.live) return structuredClone(MOCK.hist[id]||[]);
    const r = await ZOHO.CRM.API.getRelatedRecords({Entity:CFG.MODULE, RecordID:id, RelatedList:"__timeline", page:1, per_page:50}); return (r&&(r.__timeline||r.data))||[];
  },
  async save(data){
    if(!S.live){
      await wait(250);
      for(const [a,fs] of Object.entries(S.filesApi||{})) data[a] = fs.map(f=>({File_Name__s:f.name}));
      ["partner","firm","city","pin","fcity","fpin"].forEach(k=>{ const api = byK(k).api; if(data[api] && V[k]) data[api] = {id:V[k].id, name:V[k].name}; });
      if(data.Owner && S.owner) data.Owner = Object.assign({},S.owner); if(data[C.zh] && S.zh) data[C.zh] = Object.assign({},S.zh);
      if(data[C.raisedBy]) data[C.raisedBy] = {id:S.user.id, name:S.user.name};
      let row = MOCK.rows.find(r=>r.id===S.recordId); const now = new Date().toISOString(), isNew = !row;
      if(!row){ MOCK.n++; row = {id:"demo-"+MOCK.n, [C.number]:"ME - "+String(MOCK.n).padStart(4,"0"), Created_By:{name:S.user.name}, Created_Time:now}; MOCK.rows.unshift(row); }
      const before = structuredClone(row); Object.assign(row, structuredClone(data), {Modified_By:{name:S.user.name}, Modified_Time:now});
      calcStored(row);
      const fh = isNew ? [] : Object.keys(data).filter(k=>JSON.stringify(before[k]??null)!==JSON.stringify(row[k]??null)).map(k=>({field_label:(FIELDS.find(f=>f.api===k)||{label:k}).label, _value:{old:before[k], new:row[k]}}));
      (MOCK.hist[row.id] = MOCK.hist[row.id]||[]).push({done_by:{name:S.user.name}, audited_time:now, action:isNew?"added":"updated", field_history:fh});
      return row.id;
    }
    for(const [a,fs] of Object.entries(S.filesApi||{})){
      const ids = [];
      for(const f of fs){ const u = await ZOHO.CRM.API.uploadFile({CONTENT_TYPE:"multipart", PARTS:[{headers:{"Content-Disposition":"file;"},content:"__FILE__"}], FILE:{fileParam:"content", file:f}});
        const row = u&&u.data&&u.data[0]; if(!row||!row.details) throw new Error("File upload failed: "+f.name); ids.push({file_id:row.details.id}); }
      if(ids.length) data[a] = ids;
    }
    const r = S.recordId ? await ZOHO.CRM.API.updateRecord({Entity:CFG.MODULE, APIData:Object.assign({id:S.recordId},data), Trigger:["workflow"]})
                         : await ZOHO.CRM.API.insertRecord({Entity:CFG.MODULE, APIData:data, Trigger:["workflow"]});
    const row = r&&r.data&&r.data[0];
    if(!row||row.code!=="SUCCESS") throw new Error((row&&(row.message+(row.details&&row.details.api_name?" ("+row.details.api_name+")":"")))||"CRM did not accept the record");
    return S.recordId || row.details.id;
  }
};

/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v==null?"":v).replace(/,/g,"")); return isNaN(n)?0:n; };
const has = v => Array.isArray(v) ? v.length>0 : (v&&typeof v==="object") ? !!v.id : (v!==undefined && v!==null && String(v).trim()!=="");
const inr = n => "₹"+Math.round(n).toLocaleString("en-IN");
const money = v => Math.round(num(v)).toLocaleString("en-IN");
const fileNames = v => Array.isArray(v) ? v.map(x=>x.File_Name__s||x.name||"file").join(", ") : "";
const reqOf = f => typeof f.req==="function" ? f.req() : !!f.req;
function ordinalDate(iso){ if(!iso) return ""; const d = new Date(iso+"T00:00:00"); if(isNaN(d)) return iso; const n=d.getDate(), s=(n%10===1&&n!==11)?"st":(n%10===2&&n!==12)?"nd":(n%10===3&&n!==13)?"rd":"th"; return n+s+" "+d.toLocaleString("en-GB",{month:"long"})+" "+d.getFullYear(); }
function lakhs(n){ return n>=1e7 ? "₹"+(+(n/1e7).toFixed(2))+" Cr" : n>=1e5 ? "₹"+(+(n/1e5).toFixed(2))+" lakh" : inr(n); }
function shortTime(t){ const d = new Date(t); return isNaN(d) ? String(t) : d.toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}); }
function zohoNow(){ const d = new Date(), p = n=>String(n).padStart(2,"0"), o = -d.getTimezoneOffset(), sg = o>=0?"+":"-", oa = Math.abs(o);
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())+sg+p(Math.floor(oa/60))+":"+p(oa%60); }
function newSubSourceId(){ const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let r = ""; for(let i=0;i<6;i++) r += A[Math.floor(Math.random()*A.length)]; return "EV"+String(new Date().getFullYear()).slice(2)+"-"+r; }

/* Costs: Initial = first proposal, Final = negotiated (used for approvals and the ₹50K rule) */
function tmSponsorship(set){
  const spons = num(V[set==="init"?"spons":"fspons"]);
  if(!isPE()) return spons;
  const sh = V[set==="init"?"ishare":"fshare"]||{};
  if(S.share[set]==="₹") return has(sh.amt) ? Math.min(num(sh.amt), spons||Infinity) : spons;
  return has(sh.pct) ? spons*Math.min(100,num(sh.pct))/100 : spons;
}
function costs(set){
  const ours = tmSponsorship(set), total = ours + num(V[set==="init"?"prod":"fprod"]) + num(V[set==="init"?"proc":"fproc"]);
  let commit = "–";
  if(total && isPE()) commit = lakhs(total*CFG.PARTNER_MULTIPLIER)+" billing";
  else if(total && V.cat==="End Customer Event") commit = Math.ceil(total/CFG.CAC)+" Panels";
  else if(total && !V.cat) commit = "Select the event category";
  return {ours, total, commit};
}
function calcStored(row){ /* preview only: mimic the CRM formulas */
  const keep = V; V = recToV(row); row.Total_Cost = costs("init").total; row.Event_s_Total_Cost = costs("final").total; V = keep;
}

/* ================= WHO CAN DO WHAT ================= */
const st = () => S.rec[C.status]||"", tag = () => S.rec[C.tag]||"";
const isNew = () => !S.recordId;
const raisedByGTM = () => S.rec[C.team]==="GTM";
function mode(){   // "gtm" short form, "mkt" detailed form
  if(S.role==="GTM") return "gtm";
  if(S.role==="MKT") return "mkt";
  return raisedByGTM() && st()===ST.DRAFT ? "gtm" : "mkt";
}
const shown = f => {
  if(f.show && !f.show()) return false;
  if(isBR()) return !!(f.br || f.k==="cat");
  if(mode()==="gtm") return !!f.gtm;
  return true;
};
function perms(){
  const p = {edit:false, initEdit:false, finalEdit:false, actions:[], note:""}, s = st(), t = tag();
  if(S.role==="GTM"){
    if(isNew() || (s===ST.DRAFT && raisedByGTM())){ p.edit = p.initEdit = true; p.actions = ["gtmSubmit"]; p.note = "Fill the basic details and the sponsorship cost. Marketing completes the rest."; }
    else p.note = statusNote();
    return p;
  }
  if(S.role==="MKT"){
    if(isNew() || s===ST.DRAFT){ p.edit = p.initEdit = p.finalEdit = true; p.actions = ["save","submit"]; p.note = raisedByGTM() && !isNew() ? "Raised by GTM. Complete every field, then submit to the ZH." : "Fill every field. Submit sends it to the ZH."; }
    else if(s===ST.REJECTED){ p.edit = p.finalEdit = true; p.actions = ["save","submit"]; p.note = "Rejected by "+(S.rec[C.rejBy]||"approver")+". Update the final cost and resubmit."; }
    else if(t===T.ZH_SEND || t===T.ZH_PEND){ p.actions = ["zhReject","zhApprove"]; p.note = "Waiting for the ZH’s email reply. Record their decision."; }
    else if(t===T.ZH_OK){ p.actions = ["sendBH"]; p.note = "ZH approved. Send it to the BH."; }
    else p.note = statusNote();
    return p;
  }
  if(S.role==="BH"){
    if(t===T.BH_SEND || t===T.BH_PEND){ p.actions = ["bhReject","bhApprove"]; p.note = costs("final").total>CFG.FOUNDER_LIMIT ? "Above ₹50,000: approval goes to the Founder next." : "Your approval completes this request."; }
    else p.note = statusNote();
    return p;
  }
  if(S.role==="FD"){
    if(t===T.FD_SEND || t===T.FD_PEND){ p.actions = ["fdReject","fdApprove"]; p.note = "Your approval completes this request."; }
    else p.note = statusNote();
  }
  return p;
}
function statusNote(){
  const s = st(), t = tag();
  if(s===ST.APPROVED) return "Approved and locked."+(S.rec[C.sub]?" Sub Source ID: "+S.rec[C.sub]:"");
  if(s===ST.REJECTED) return "Rejected by "+(S.rec[C.rejBy]||"approver")+". Marketing is revising it.";
  if(s===ST.DRAFT) return raisedByGTM() ? "Pending on Marketing to complete the details." : "Draft.";
  if(t===T.ZH_SEND||t===T.ZH_PEND) return "With the ZH for approval.";
  if(t===T.ZH_OK) return "Approved by the ZH. Marketing sends it to the BH.";
  if(t===T.BH_SEND||t===T.BH_PEND) return "With the BH for approval.";
  if(t===T.FD_SEND||t===T.FD_PEND) return "With the Founder for approval.";
  return "Read-only.";
}

/* Cost screens
   A: Marketing raises it          → one set only (Initial). On first submit it is copied to Final.
   B: Marketing completes GTM's    → GTM's Initial (read-only) + Final (Marketing fills) + counts
   C: after the first submit       → Initial (read-only) + Final (editable only when Rejected) */
const DETAIL_KEYS = ["gift","giftc","merch","merchc","broc"];
const caseA = () => S.role==="MKT" && (isNew() || (st()===ST.DRAFT && !raisedByGTM()));
const caseB = () => S.role==="MKT" && st()===ST.DRAFT && raisedByGTM() && !isNew();
const activeSet = () => caseA() ? "init" : "final";
function lockedField(f,p){
  if(f.sec==="init"){
    if(mode()==="gtm") return !p.initEdit;
    if(caseA()) return !p.edit;
    if(caseB()) return !DETAIL_KEYS.includes(f.k);
    return true;
  }
  if(f.sec==="final") return !(caseB() || (S.role==="MKT" && st()===ST.REJECTED));
  if(f.k==="cat" && !isNew() && S.role==="MKT" && st()!==ST.DRAFT) return true;
  return false;
}
function renderCost(p){
  const g = mode()==="gtm" && !isBR();
  const blocks = [];
  const one = (f, editable) => { const can = editable && !lockedField(f,p);
    if(can && f.needs && !V[f.needs]) return field(f,true).replace('<input class="in"','<input class="in" disabled title="Tick the box first"');
    return field(f,can); };
  const fl = (list, editable) => { const L = list.filter(shown), main = L.filter(f=>!DETAIL_KEYS.includes(f.k)), det = L.filter(f=>DETAIL_KEYS.includes(f.k));
    const four = main.some(f=>f.type==="share");
    return `<div class="fgrid${four?" cost4":""}">${main.map(f=>one(f,editable)).join("")}</div>`+(det.length?`<div class="detrow">${det.map(f=>one(f,editable)).join("")}</div>`:""); };
  const of = sec => FIELDS.filter(f=>f.sec===sec);
  if(isBR()) blocks.push(fl(of("brVendor"), p.edit));
  else if(g || caseA()) blocks.push(fl(of("init"), p.edit));
  else {
    const ic = costs("init"), b = caseB();
    const initList = of("init").filter(f=>!b || !DETAIL_KEYS.includes(f.k));
    blocks.push(`<div class="cost-block"><h3>Initial cost <span class="lock">${b?"proposed by GTM":"first proposal, locked"}</span></h3>${fl(initList, false)}<p class="cellnote">Initial total: <b>${ic.total?inr(ic.total):"–"}</b>${ic.commit!=="–"?" · "+esc(ic.commit):""}</p></div>`);
    const finEdit = !lockedField(byK("fspons"),p);
    blocks.push(`<div class="cost-block"><h3>Final cost <span class="lock">${finEdit?"negotiated, used for approvals":"locked"}</span></h3>${fl(of("final").concat(b ? of("init").filter(f=>DETAIL_KEYS.includes(f.k)) : []), p.edit || b)}</div>`);
  }
  $("costBlocks").innerHTML = blocks.join("");
  const showSum = !isBR() && !g;
  ["summary","foot","sheetH","sheet"].forEach(id=>$(id).classList.toggle("hidden", !showSum));
  if(showSum){
    const set = activeSet(), c = costs(set);
    $("summary").innerHTML = `<div class="big"><span>${set==="init"?"Total event cost*":"Final event cost*"}</span><b>${c.total?inr(c.total):"–"}</b></div><div class="big"><span>Business commitment</span><b>${esc(c.commit)}</b></div>`;
    renderSheet(c, set);
    let due = "within 45 days of the event date";
    if(V.date){ const d = new Date(V.date+"T00:00:00"); if(!isNaN(d)){ d.setDate(d.getDate()+45); due = "by "+d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})+" (45 days from the event date)"; } }
    $("foot").innerHTML = `* GST &amp; transportation charges are extra, at actuals.<br>* ${isPE()?"Partner target":"Panel commitment"} to be fulfilled ${esc(due)}.`;
  }
}
function field(f, edit){

  if(f.type==="subtype" && isPE()) return `<div class="${cls}"><span class="f">${esc(f.label)}</span><div class="static">Partner Enablement Event</div></div>`;
  if(f.type==="check"){ return `<div class="${cls}"><span class="f">&nbsp;</span><label class="check"><input type="checkbox" id="${id}" data-chk="${f.k}" ${v?"checked":""} ${edit?"":"disabled"}> ${esc(f.label)}</label></div>`; }

  if(!edit){

  else if(f.type==="select") ctrl = `<select class="in" id="${id}" data-k="${f.k}"><option value="">Select</option>${f.options.map(o=>`<option ${v===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;

  else if(f.type==="citylk"||f.type==="pinlk"){ const kind = f.type==="citylk"?"city":"pin"; ctrl = `<div class="typeahead"><input class="in" id="${id}" data-lq="${f.k}" autocomplete="off" ${kind==="pin"?'inputmode="numeric" maxlength="6" placeholder="Type 3+ digits"':'placeholder="Type to search"'} value="${esc((v&&v.name)||V["_lq_"+f.k]||"")}"><ul class="ta-list hidden" id="ll_${f.k}"></ul></div>${kind==="pin"&&S.districtName&&v&&v.id?`<p class="cellnote">${esc(S.districtName)}</p>`:""}`; }
  else if(f.type==="auto") ctrl = `<input class="in" id="${id}" value="${esc(v)}" readonly tabindex="-1" placeholder="From city">`;
  else if(f.type==="textarea") ctrl = `<textarea class="in" id="${id}" data-k="${f.k}" rows="2">${esc(v)}</textarea>`;
  else if(f.type==="map") ctrl = `<div class="maprow"><input class="in" id="${id}" data-k="map" type="url" value="${esc(v)}" placeholder="Paste a Google Maps link"><button type="button" class="btn" id="locBtn">Use my location</button>${has(v)?`<a class="btn" href="${esc(v)}" target="_blank" rel="noopener">Open map</a>`:""}</div>`;
  else {

    ctrl = f.type==="money" ? `<div class="money">${inp}</div>` : inp;

  return `<div class="${cls}">${label}${ctrl}${f.help?`<p class="cellnote">${esc(f.help)}</p>`:""}</div>`;
}

/* ================= VALIDATION ================= */
function missing(tabOnly){
  const out = []; S.firstMissing = null;
  const secsOf = { event:["secType","secBasic"], cost:["init","final","brVendor"] };
  const secs = tabOnly ? secsOf[tabOnly] : secsOf.event.concat(secsOf.cost);
  for(const f of FIELDS){
    if(!secs.includes(f.sec) || !shown(f) || !reqOf(f)) continue;
    if(S.role==="MKT" && !isBR()){
      if(f.sec==="final" && caseA()) continue;
      if(f.sec==="init" && !caseA() && !(caseB() && DETAIL_KEYS.includes(f.k))) continue;
    }
    if(f.k==="sub" && isPE()) continue;
    let ok;
    if(f.type==="share"){ const sh = V[f.k]||{}; ok = S.share[f.set]==="₹" ? has(sh.amt) : has(sh.pct); }
    else if(f.type==="file") ok = has(V[f.k]) || (S.files[f.k]&&S.files[f.k].length);
    else ok = has(V[f.k]);
    if(!ok){ out.push((f.sec==="final"&&!caseA()?"final ":"")+f.label.toLowerCase()); if(!S.firstMissing) S.firstMissing = f; }
  }
  if(shown(byK("pocm")) && has(V.pocm) && String(V.pocm).replace(/\D/g,"").length<10) out.push("a 10-digit mobile number");
  return out;
}
function fail(list){
  if(S.firstMissing){ const t = ["init","final","brVendor"].includes(S.firstMissing.sec) ? "cost" : "event"; if(t!==S.tab){ S.tab = t; render(); } const el = $("f_"+S.firstMissing.k); el && el.focus(); S.firstMissing = null; }
  $("msg").textContent = "Add "+list.join(", ")+" to continue."; $("msg").classList.add("err");
}

/* ================= SAVE ================= */
function payload(){
  const o = {};
  for(const f of FIELDS){
    if(!f.api || f.type==="file") continue;
    if(!shown(f)){ if(f.k==="sub" && isBR()) o[f.api] = null; continue; }
    if(lockedField(f, perms())) continue;
    let v = V[f.k];
    if(f.k==="sub" && isPE()) v = "Partner Enablement Event";
    if(["lookup","partner","citylk","pinlk"].includes(f.type)) v = v&&v.id ? {id:v.id} : null;
    else if(f.type==="money"||f.type==="count") v = has(v) ? num(v) : null;
    else if(f.type==="check") v = !!v;
    else if(!has(v)) v = null;
    o[f.api] = v;
  }
  // Teachmint share (Partner Enablement), initial and final kept separately
  for(const set of ["init","final"]){
    const f = FIELDS.find(x=>x.type==="share" && x.set===set);
    if(!shown(f) || lockedField(f, perms())) continue;
    const a = SHARE_API[set], sh = V[f.k]||{}, amt = S.share[set]==="₹";
    o[a.type] = amt ? CFG.SHARE.AMT : CFG.SHARE.PCT; o[a.amt] = amt && has(sh.amt) ? num(sh.amt) : null; o[a.pct] = !amt && has(sh.pct) ? +num(sh.pct).toFixed(2) : null;
  }
  if(isBR()) o.Name = "Partner Branding – "+((V.firm&&V.firm.name)||(V.fcity&&V.fcity.name)||"");
  if(S.ownerDirty || isNew()){
    if(S.owner) o.Owner = {id:S.owner.id}; if(S.districtId) o[C.district] = {id:S.districtId}; if(S.zh) o[C.zh] = {id:S.zh.id};
  }
  if(isNew()){ if(S.user.id) o[C.raisedBy] = {id:S.user.id}; o[C.team] = S.role==="GTM" ? "GTM" : "Marketing"; }
  const files = {}; for(const f of FIELDS) if(f.type==="file" && S.files[f.k] && S.files[f.k].length && shown(f)) files[f.api] = S.files[f.k];
  S.filesApi = files;
  return o;
}
async function commit(data, okText, done){
  S.busy = true; render();

    S.recordId = await API.save(data); S.files = {}; S.filesApi = null; S.ownerDirty = false;
    const fresh = await API.load(S.recordId); if(fresh && fresh.id) loadRecord(fresh);
    if(done) showDone(done); else toast(okText);
  }catch(err){ $("msg").textContent = "Couldn’t save: "+(err.message||err); $("msg").classList.add("err"); }
  S.busy = false; if(S.view==="form") render();
}

function recToV(rec){
  const v = {};
  for(const f of FIELDS){ if(!f.api) continue; let x = rec[f.api]; if(f.type==="check") x = !!x; v[f.k] = x==null ? "" : x; }
  if(rec[CFG.MAP_FIELD]) v.map = rec[CFG.MAP_FIELD];
  v.ishare = {pct: rec[SHARE_API.init.pct]??"", amt: rec[SHARE_API.init.amt]??""};
  v.fshare = {pct: rec[SHARE_API.final.pct]??"", amt: rec[SHARE_API.final.amt]??""};
  return v;
}
function loadRecord(rec){
  S.recordId = rec.id; S.rec = rec; V = recToV(rec); S.finalTouched = has(rec.Event_s_Sponsorship_Cost);
  S.share.init = rec[SHARE_API.init.type]===CFG.SHARE.AMT ? "₹" : "%";
  S.share.final = rec[SHARE_API.final.type]===CFG.SHARE.AMT ? "₹" : (rec[SHARE_API.final.type] ? "%" : S.share.init);
  if(V.cat==="Partner Event") V.sub = "Partner Enablement Event";

  if(caseB() && !has(V.fspons)){
    [["fspons","spons"],["fprod","prod"],["fproc","proc"]].forEach(([a,b])=>{ if(!has(V[a]) && has(V[b])) V[a] = V[b]; });
    if(isPE() && !has(V.fshare.pct) && !has(V.fshare.amt)) V.fshare = Object.assign({}, V.ishare);
  }
  S.owner = rec.Owner ? {id:rec.Owner.id, name:rec.Owner.name} : null;
  S.zh = rec[C.zh] ? {id:rec[C.zh].id, name:rec[C.zh].name} : null;

const TAGS_OF = {zh:[T.ZH_SEND,T.ZH_PEND,T.ZH_OK], bh:[T.BH_SEND,T.BH_PEND], fd:[T.FD_SEND,T.FD_PEND]};
function criteria(f){
  const c = [], e2 = t => String(t).replace(/[(),]/g,"\\$&"), anyOf = (fld,vals)=>"("+vals.map(v=>"("+fld+":equals:"+e2(v)+")").join("or")+")";
  if(f.filter==="pendmkt") c.push("((Raised_by_Team:equals:GTM)and(Status:equals:Draft))");
  if(f.filter==="mine") c.push("(Raised_by:equals:"+S.user.id+")");
  if(TAGS_OF[f.filter]) c.push(anyOf("Event_Tag", TAGS_OF[f.filter]));
  if(f.filter==="rejected") c.push("(Status:equals:Rejected)");
  if(f.filter==="approved") c.push("(Status:equals:Approved)");
  const t = e2((f.q||"").trim());
  if(t){ const parts = ["(Name:starts_with:"+t+")"]; if(/^\d{1,4}$/.test(t)) parts.push("(Event_Number:equals:ME - "+t.padStart(4,"0")+")"); c.push(parts.length>1?"("+parts.join("or")+")":parts[0]); }
  return c.length ? (c.length>1 ? "("+c.join("and")+")" : c[0]) : "";
}
function matches(r,f){
  if(f.filter==="pendmkt" && !(r.Raised_by_Team==="GTM" && r.Status===ST.DRAFT)) return false;
  if(f.filter==="mine" && !(r[C.raisedBy]&&r[C.raisedBy].id===S.user.id)) return false;
  if(TAGS_OF[f.filter] && !TAGS_OF[f.filter].includes(r.Event_Tag)) return false;
  if(f.filter==="rejected" && r.Status!==ST.REJECTED) return false;
  if(f.filter==="approved" && r.Status!==ST.APPROVED) return false;
  if(f.q && !((r.Name||"")+" "+(r.Event_Number||"")).toLowerCase().includes(f.q.toLowerCase())) return false;
  return true;
}
async function loadList(){
  const seq = ++listSeq; L.loading = true; renderList();
  try{ const r = await API.list(L); if(seq!==listSeq) return; L.rows = r.rows; L.more = r.more; L.error = ""; }
  catch(err){ if(seq===listSeq){ L.rows = []; L.more = false; L.error = (err&&err.message)||"Unknown error"; } }
  L.loading = false; renderList();
}
function renderList(){
  $("filterBtns").innerHTML = FILTERS.map(([k,l])=>`<button type="button" data-filter="${k}" aria-pressed="${L.filter===k}">${esc(l)}</button>`).join("");
  const head = `<colgroup><col class="c-no"><col class="c-ev"><col class="c-dt"><col class="c-ow"><col class="c-st"><col class="c-tg"></colgroup><thead><tr><th scope="col">Event no.</th><th scope="col">Event</th><th scope="col">Date</th><th scope="col">Owner</th><th scope="col">Status</th><th scope="col">Tag</th></tr></thead>`;
  let body;
  if(L.loading) body = `<tr><td colspan="6" class="empty">Loading requests…</td></tr>`;
  else if(L.error) body = `<tr><td colspan="6" class="empty">Couldn’t load requests: ${esc(L.error)}</td></tr>`;
  else if(!L.rows.length) body = `<tr><td colspan="6" class="empty">${L.filter==="all"&&!L.q?"No event requests yet. Click “+ New request” to raise one.":"No requests match this filter."}</td></tr>`;
  else body = L.rows.map(r=>`<tr><td data-l="no">${esc(r.Event_Number||"–")}</td><td data-l="event" title="${esc(r.Name||"")}"><button type="button" class="open" data-open="${esc(r.id)}">${esc(r.Name||"Untitled")}</button></td><td data-l="date">${esc(ordinalDate(r.Event_Date)||"–")}</td><td data-l="owner">${esc((r.Owner&&r.Owner.name)||"–")}</td><td data-l="status">${r.Status?`<span class="chip">${esc(r.Status)}</span>`:"–"}</td><td data-l="tag" title="${esc(r.Event_Tag||"")}">${esc(r.Event_Tag||"")}</td></tr>`).join("");
  $("list").innerHTML = head+"<tbody>"+body+"</tbody>";
  $("pageInfo").textContent = L.rows.length ? "Page "+L.page : "";
  $("prevPg").disabled = L.page<=1||L.loading; $("nextPg").disabled = !L.more||L.loading;
}
function show(v){ S.view = v; ["list","form","done"].forEach(x=>$(x+"View").classList.toggle("hidden", x!==v)); $("bar").classList.toggle("hidden", v!=="form"); window.scrollTo(0,0); }
function blank(){ S.recordId = null; S.rec = {}; V = {country:"India", ishare:{}, fshare:{}}; S.files = {}; S.owner = null; S.zh = null; S.districtId = null; S.districtName = ""; S.ownerDirty = false; S.share = {init:"%", final:"%"}; S.route = "zh"; S.tab = "event"; S.tl = null; S.finalTouched = false; clearErr(); }
function showList(){ show("list"); loadList(); }
function newRecord(){ blank(); show("form"); render(); }
async function openRecord(id){
  blank(); show("form"); $("msg").textContent = "Loading the request…"; $("btns").innerHTML = "";
  try{ const rec = await API.load(id); if(!rec.id) throw new Error("Record not found or no access."); loadRecord(rec); }
  catch(err){ $("msg").textContent = "Couldn’t open: "+(err.message||err); $("msg").classList.add("err"); }
}

/* ================= BOOT ================= */
async function boot(entityId){
  const u = await API.me(); S.role = u.role; S.user = {id:u.id, name:u.name};
  if(entityId) openRecord(entityId); else showList();
}
if(window.ZOHO && ZOHO.embeddedApp){
  S.live = true;
  ZOHO.embeddedApp.on("PageLoad", d=>{ const pos = String((d && (d.ButtonPosition||d.buttonPosition))||""); const id = d && (Array.isArray(d.EntityId)?d.EntityId[0]:d.EntityId); boot(/detail/i.test(pos) ? id : null); });
  ZOHO.embeddedApp.init();
} else {
  $("demoBar").classList.remove("hidden");
  $("resetDemo").addEventListener("click",()=>{ MOCK.rows = []; MOCK.n = 0; showList(); });
  boot(null);
}
</script>
</body>
</html>

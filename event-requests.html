<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Requests</title>
<!--ZOHO_SDK--><script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script><!--/ZOHO_SDK-->
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --ink:#18202E; --muted:#5B6578; --line:#DCE1E8; --line-soft:#EBEEF2;
  --gtm:#1F6F78; --gtm-soft:#E4F1F2; --mkt:#3A47A8; --mkt-soft:#E8EAF7;
  --up:#A33A2B; --up-soft:#F8E6E3; --down:#2D7A4B; --down-soft:#E3F2E8; --focus:#3A47A8;
  --field:#FFFFFF; --field-off:#F1F3F6;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12161D; --surface:#1A2029; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2E3644; --line-soft:#252C38;
  --gtm:#5FB7C0; --gtm-soft:#1C3236; --mkt:#8E98E8; --mkt-soft:#232848;
  --up:#E8857A; --up-soft:#3A2420; --down:#72C493; --down-soft:#1C3326; --focus:#8E98E8;
  --field:#141920; --field-off:#1F2530; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12161D; --surface:#1A2029; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2E3644; --line-soft:#252C38;
  --gtm:#5FB7C0; --gtm-soft:#1C3236; --mkt:#8E98E8; --mkt-soft:#232848;
  --up:#E8857A; --up-soft:#3A2420; --down:#72C493; --down-soft:#1C3326; --focus:#8E98E8;
  --field:#141920; --field-off:#1F2530; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:20px 20px 120px}
h1{font-size:24px;line-height:1.25;margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 4px;font-weight:600}
p{margin:0}
.sub{color:var(--muted);font-size:13.5px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.demo{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:13.5px}
.demo .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.demo .seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer}
.demo .seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.linkbtn{border:0;background:none;color:var(--mkt);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}

.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;background:var(--surface);white-space:nowrap}
.chip b{font-weight:600}
.you-gtm{border-color:var(--gtm);color:var(--gtm)}
.you-mkt{border-color:var(--mkt);color:var(--mkt)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
.panel-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}

.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cat{border:1px solid var(--line);border-radius:8px;background:var(--field);padding:14px;text-align:left;cursor:pointer}
.cat strong{display:block;font-weight:600}
.cat span{font-size:13px;color:var(--muted)}
.cat[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cat:disabled{cursor:default}
.subtypes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{border:1px solid var(--line);border-radius:20px;background:var(--field);padding:6px 14px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.auto-note{margin-top:12px;font-size:13.5px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 16px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}
label.f{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
label.f i{font-style:normal;color:var(--up)}
.in{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:8px 10px;min-height:38px}
.in:disabled,.in[readonly]{background:var(--field-off);color:var(--muted)}
textarea.in{min-height:72px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.hint.err{color:var(--up)}
.hint.ok{color:var(--down)}
.owner{display:flex;align-items:center;gap:8px;min-height:38px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--field-off)}
.owner .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.owner.found .dot{background:var(--down)}
.typeahead{position:relative}
.ta-list{position:absolute;z-index:5;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:6px;max-height:200px;overflow:auto;list-style:none;padding:4px;margin-left:0}
.ta-list li button{width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:4px;cursor:pointer}
.ta-list li button:hover{background:var(--field-off)}

/* Negotiation ledger */
.ledger-wrap{overflow-x:auto}
table.ledger{width:100%;border-collapse:collapse;min-width:640px}
.ledger th,.ledger td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;text-align:left}
.ledger thead th{font-size:13px;font-weight:600;border-bottom:1px solid var(--line)}
.ledger thead th.gtm{color:var(--gtm);background:var(--gtm-soft)}
.ledger thead th.mkt{color:var(--mkt);background:var(--mkt-soft)}
.ledger td.gtm{background:color-mix(in srgb,var(--gtm-soft) 45%,transparent)}
.ledger td.mkt{background:color-mix(in srgb,var(--mkt-soft) 45%,transparent)}
.ledger th[scope="row"]{font-weight:500;width:24%}
.ledger th[scope="row"] small{display:block;font-weight:400;color:var(--muted);font-size:12px;line-height:1.35}
.ledger .in{min-width:0}
.ledger tr.total th,.ledger tr.total td{font-weight:600;border-bottom:0}
.ledger tr.commit th,.ledger tr.commit td{font-weight:600}
.money{position:relative}
.money::before{content:"₹";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.money .in{padding-left:24px;text-align:right}
.diff{display:inline-block;font-size:12.5px;border-radius:4px;padding:2px 7px;white-space:nowrap}
.diff.same{color:var(--muted)}
.diff.up{color:var(--up);background:var(--up-soft)}
.diff.down{color:var(--down);background:var(--down-soft)}
.static{min-height:38px;display:flex;align-items:center}
.filecell{font-size:13px}
.filecell input{max-width:100%;font-size:13px}
.legend{font-size:13px;color:var(--muted)}

/* Sample draft — the proposal sheet approvers see */
.sheet-wrap{overflow-x:auto}
table.sheet{width:100%;border-collapse:collapse;min-width:640px;font-size:14px}
.sheet th,.sheet td{border:1px solid var(--ink);padding:8px 10px;vertical-align:middle}
.sheet thead th{font-weight:600;text-align:center}
.sheet td.ev{font-weight:600}
.sheet td.num{text-align:right}
.sheet td.ctr{text-align:center}
.sheet td.commit{font-size:20px;font-weight:700;text-align:center}
.sheet small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.sheet tfoot td{font-weight:600}

.remarks{margin-top:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:1040px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar .msg{font-size:13.5px;color:var(--muted);max-width:560px}
.bar .msg.err{color:var(--up)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 16px;font-weight:500;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.reject{background:var(--up);border-color:var(--up);color:#fff}
.btn.approve{background:var(--down);border-color:var(--down);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:6px;font-size:14px;z-index:20}

@media (max-width:560px){
  .cats{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr}
  .c2,.c3,.c4,.c6{grid-column:span 2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.form-grid .full{grid-column:1/-1}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.summary div{background:var(--field-off);border-radius:8px;padding:12px}
.summary span{display:block;font-size:12.5px;color:var(--muted)}
.summary b{font-size:18px;font-weight:600}
.note{font-size:13px;color:var(--muted);background:var(--field-off);border-radius:6px;padding:8px 12px;margin-bottom:14px}
.note.warn{color:var(--up);background:var(--up-soft)}
.side-gtm{border-color:var(--gtm)!important;color:var(--gtm)!important}
@media (max-width:560px){.form-grid,.summary{grid-template-columns:1fr}.listhead .btn{width:100%}.bar .btns{width:100%}.bar .btn{flex:1}}
/* ---------- list, options, info ---------- */
.info{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 16px}
.info div span{display:block;font-size:12.5px;color:var(--muted)}
.info div b{font-weight:500}
.opt{display:flex;flex-wrap:wrap;gap:6px}
.opt button{border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);padding:6px 12px;cursor:pointer;font-size:13.5px}
.opt button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cellnote{font-size:12px;color:var(--muted);margin-top:4px}
.listhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.filters .in{max-width:300px}
table.list{width:100%;border-collapse:collapse;min-width:720px}
.list th,.list td{padding:10px 12px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:middle;font-size:14px}
.list thead th{font-size:13px;font-weight:600;border-bottom:1px solid var(--line)}
.list tbody tr:hover{background:var(--field-off)}
.list .open{border:0;background:none;padding:0;color:var(--mkt);font:inherit;font-weight:600;cursor:pointer;text-align:left}
.list .open:hover{text-decoration:underline}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:13.5px;color:var(--muted)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.back{margin-bottom:10px;display:inline-block}
.listhead + .panel{margin-top:0}
/* ---------- phones ---------- */
@media (max-width:560px){
  .wrap{padding:14px 12px 140px}
  h1{font-size:20px}
  .panel{padding:14px;border-radius:8px}
  .head,.listhead{flex-direction:column;align-items:stretch;gap:10px}
  .listhead .btn{width:100%;padding:12px}
  .chips{gap:4px}
  .info{grid-template-columns:1fr 1fr;gap:10px}
  .listhead{margin-bottom:12px}
  .form-grid,.summary{grid-template-columns:1fr}
  .in,select.in,textarea.in{font-size:16px;min-height:44px}          /* stops iPhone zoom on focus */
  .opt{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  .opt button{flex:0 0 auto;padding:9px 12px;min-height:40px}
  .form-grid .opt{flex-wrap:wrap;overflow:visible}
  .form-grid .opt button{flex:1 1 auto}
  .filters{flex-direction:column;align-items:stretch}
  .filters .in{max-width:none}
  .filters .opt{max-width:100%;min-width:0;width:100%}
  .wrap,.panel{min-width:0;max-width:100%}
  /* list becomes cards */
  table.list{min-width:0}
  .list thead{display:none}
  .list tbody tr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .list tbody td{display:block;padding:0;border:0;font-size:13.5px}
  .list td[data-l="event"]{grid-column:1 / -1;order:-2;font-size:15px}
  .list td[data-l="no"]{order:-1;color:var(--muted)}
  .list td[data-l="status"]{text-align:right}
  .list td[data-l="date"],.list td[data-l="owner"],.list td[data-l="tag"]{color:var(--muted)}
  .list td.empty{grid-column:1 / -1}
  .pager{flex-direction:column;align-items:stretch}
  .pager span:last-child{display:flex;gap:8px}.pager .btn{flex:1}
  .bar{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
  .bar-in{flex-direction:column;align-items:stretch;gap:8px}
  .bar .msg{font-size:13px}
  .bar .btns{display:flex;gap:8px}.bar .btn{flex:1;padding:12px 10px}
  .toast{bottom:120px;max-width:90vw;text-align:center}
  .ta-list{max-height:180px}
}
/* ---------- compact form, header, tabs, timeline ---------- */
.wrap{padding:16px 16px 110px}
.panel{padding:14px 16px;margin-bottom:12px}
.in{min-height:34px;padding:6px 10px;font-size:14px;border-radius:6px}
select.in{padding-right:28px}
textarea.in{min-height:58px}
label.f,.f{display:block;font-size:12.5px;font-weight:500;margin-bottom:3px;color:var(--muted)}
.static{min-height:0;font-size:14px;padding:2px 0}
.money .in{padding-left:22px}
.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 14px}
.s1{grid-column:span 1}.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}
h2.sec{font-size:14px;font-weight:600;margin:4px 0 8px}
h2.sec + .fgrid{margin-bottom:14px}
.fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}
.fh-left{min-width:0}.fh-left h1{font-size:19px;margin-top:2px}
.fh-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:55%}
.chips{justify-content:flex-end}
.meta{display:grid;grid-template-columns:auto auto;gap:2px 10px;margin:0;font-size:12.5px}
.meta dt{color:var(--muted);text-align:right}.meta dd{margin:0;font-weight:500}
.back{margin:0 0 4px;font-size:13px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 12px}
.tab{border:0;background:none;color:var(--muted);padding:8px 14px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.summary div{padding:10px 12px}.summary b{font-size:16px}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 18px;border-left:2px solid var(--line);margin-left:5px}
.tl li::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--mkt)}
.tl li:last-child{padding-bottom:0}
.tl .who{font-size:13.5px;font-weight:500}.tl .when{font-size:12.5px;color:var(--muted)}
.tl .chg{font-size:13px;margin-top:4px;color:var(--ink)}.tl .chg span{color:var(--muted)}
.bar-in{flex-wrap:nowrap}.bar .btns{flex-wrap:nowrap;flex-shrink:0}.bar .btn{padding:8px 16px;white-space:nowrap}
@media (max-width:620px){
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.s3,.s4,.s5,.s6{grid-column:span 2}.s1,.s2{grid-column:span 1}
  .fhead{flex-direction:column}.fh-right{align-items:flex-start;max-width:none}.chips{justify-content:flex-start}.meta dt{text-align:left}
}
@media (max-width:420px){
  .fgrid,.summary{grid-template-columns:1fr}.s1,.s2,.s3,.s4,.s5,.s6{grid-column:span 1}
  .in,select.in,textarea.in{font-size:16px;min-height:42px}
  .bar-in{flex-wrap:wrap}.bar .btns{width:100%}.bar .btn{flex:1;padding:11px}
}
.maprow{display:flex;gap:8px;align-items:center}.maprow .in{flex:1;min-width:0}.maprow .btn{white-space:nowrap;padding:6px 12px;text-decoration:none;display:inline-flex;align-items:center;min-height:34px}
@media (max-width:420px){.maprow{flex-wrap:wrap}.maprow .btn{flex:1;justify-content:center}}
.fhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:18px}
.fh-mid{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:22px 0 0;font-size:13px;align-self:start}
.fh-mid dt{color:var(--muted)}.fh-mid dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.fh-right{max-width:none}
:root{--cost:#1E7A47;--target:#A9473D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cost:#6CC793;--target:#E0938A}}
:root[data-theme="dark"]{--cost:#6CC793;--target:#E0938A}
.summary{grid-template-columns:repeat(2,minmax(0,1fr))}
.summary .big{padding:14px 16px}.summary .big span{font-size:13px}
.summary .big b{display:block;font-size:24px;font-weight:700;margin-top:2px}
.cost{color:var(--cost)!important}.target{color:var(--target)!important}
.foot{font-size:11.5px;color:var(--muted);margin-top:6px}
.sheet-wrap{overflow-x:auto}
table.sheet{width:100%;border-collapse:collapse;min-width:600px;font-size:13px}
.sheet th,.sheet td{border:1px solid var(--ink);padding:6px 8px;vertical-align:middle}
.sheet thead th{font-weight:600;text-align:center}
.sheet td.ev{font-weight:600}.sheet td.num{text-align:right}.sheet td.ctr{text-align:center}
.sheet td.commit{font-size:18px;font-weight:700;text-align:center}
.sheet small{display:block;color:var(--muted);font-size:11px}
.sheet tfoot td{font-weight:600}
@media (max-width:620px){.fhead{grid-template-columns:1fr}.fh-mid{margin-top:0}}
@media (max-width:420px){.summary{grid-template-columns:1fr}}
.fh-left h1{font-size:13.5px;font-weight:600;margin:2px 0 0}
.fh-left .sub{font-size:12px}
.fh-mid{display:block;margin:16px 0 0}
.ev-name{font-size:19px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.ev-owner{font-size:13px;color:var(--muted);margin-top:3px}
.today{font-size:13px;font-weight:600}
.fh-right .meta{margin-top:10px}
.sharerow{display:flex;gap:8px;align-items:center}.sharerow .opt{flex:0 0 auto;flex-wrap:nowrap}.sharerow .opt button{min-width:34px;padding:6px 10px}.sharerow > div:last-child{flex:1;min-width:0}
.pct{position:relative}.pct::after{content:"%";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted)}.pct .in{padding-right:24px}
.toprow{display:flex;gap:10px;align-items:center;margin-bottom:10px}.toprow .in{flex:1;min-width:0;max-width:none}.toprow .btn{white-space:nowrap}
.filters-row{margin-bottom:10px}
table.list{min-width:0!important;table-layout:fixed;width:100%}
.list th,.list td{padding:8px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.list col.c-no{width:13%}.list col.c-ev{width:31%}.list col.c-dt{width:15%}.list col.c-ow{width:17%}.list col.c-st{width:12%}.list col.c-tg{width:12%}
.list .chip{font-size:11.5px;padding:2px 7px}
@media (max-width:560px){.toprow .btn{padding:9px 12px}}
.fhead{grid-template-columns:auto minmax(200px,1fr) minmax(0,40%)!important}.fh-right{min-width:0}.fh-right .chips{flex-wrap:wrap}.fh-mid{min-width:0}
@media (max-width:620px){.fhead{grid-template-columns:1fr!important}}
input[type=file].in{font-size:12.5px;padding:5px 6px}
</style>
</head>
<body>
<div class="wrap">
  <div id="demoBar" class="demo hidden" role="region" aria-label="Preview"><span>Preview mode, no CRM connection. Add <b>?as=gtm</b> to the address to preview as GTM.</span> <button type="button" class="linkbtn" id="resetDemo">Start over</button></div>

  <!-- HOME: list of requests -->
  <section id="listView" aria-label="Event requests">
    <div class="panel">
      <div class="toprow">
        <label class="hidden" for="q">Search</label>
        <input class="in" id="q" type="search" placeholder="Search event name or number" autocomplete="off">
        <button type="button" class="btn primary" id="newBtn">+ New request</button>
      </div>
      <div class="opt filters-row" role="group" aria-label="Filter" id="filterBtns"></div>
      <table class="list" id="list"></table>
      <div class="pager"><span id="pageInfo"></span><span><button type="button" class="btn" id="prevPg">Previous</button> <button type="button" class="btn" id="nextPg">Next</button></span></div>
    </div>
  </section>

  <!-- FORM: one set of values, saved to the GTM or Marketing fields by login -->
  <div id="formView" class="hidden">
    <div class="fhead">
      <div class="fh-left">
        <button type="button" class="linkbtn back" id="backBtn">← All requests</button>
        <h1 id="title">New event request</h1>
        <p class="sub" id="subtitle"></p>
      </div>
      <div class="fh-mid" id="mid"></div>
      <div class="fh-right"><div class="chips" id="chips"></div><dl class="meta" id="meta"></dl></div>
    </div>
    <div id="notes"></div>
    <section class="panel hidden" id="remarksPanel" aria-labelledby="remH">
      <h2 id="remH" style="margin-bottom:4px">ZH rejection remarks</h2>
      <p class="sub" style="margin-bottom:8px">Paste what the ZH wrote in their email reply.</p>
      <label class="hidden" for="remarks">Rejection remarks</label>
      <textarea class="in" id="remarks"></textarea>
    </section>
    <div class="tabs" role="tablist" aria-label="Request sections" id="tabs"></div>
    <section class="panel tabpanel" id="tab-event" role="tabpanel">
      <h2 class="sec">Event type</h2><div class="fgrid" id="secType"></div>
      <h2 class="sec">Basic details</h2><div class="fgrid" id="secBasic"></div>
    </section>
    <section class="panel tabpanel hidden" id="tab-cost" role="tabpanel">
      <div class="fgrid" id="secOther"></div>
      <div class="summary" id="summary"></div>
      <p class="foot">* GST &amp; transportation charges are extra, at actuals.</p>
      <h2 class="sec" style="margin-top:16px">Sample draft</h2>
      <div class="sheet-wrap" id="sheet"></div>
    </section>
    <section class="panel tabpanel hidden" id="tab-time" role="tabpanel"><div id="timeline"></div></section>
  </div>
</div>

<div class="bar hidden" id="bar" role="region" aria-label="Actions">
  <div class="bar-in"><p class="msg" id="msg" aria-live="polite"></p><div class="btns" id="btns"></div></div>
</div>
<div class="toast hidden" id="toast" role="status"></div>

<script>
/* ============ CONFIG ============ */
const CFG = {
  MODULE:"Marketing_Events", MAP_FIELD:"Google_Map_Location",   // URL field on Marketing Events
  PINCODE_MODULE:"Pincodes", DISTRICT_MODULE:"District", PARTNER_MODULE:"Accounts",
  CAC:2000, FOUNDER_LIMIT:50000, PARTNER_MULTIPLIER:100,
  MARKETING_KEYWORDS:["marketing"],   // role or profile name contains this → Marketing; everyone else → GTM
  ZH_BY_ZONE:{"North 1":{id:"681278000000676466",name:"Vivek Mishra"},"East":{id:"681278000000676466",name:"Vivek Mishra"},"North 2":{id:"681278000000676433",name:"Suraj Agrahari"},"South":{id:"681278000000813134",name:"Swapnil Omprakash Mandhana"},"West":{id:"681278000000676418",name:"Hariom Shivhare"}},
  TAG:{ PENDING_ZH:"Send to GTM Approval", ZH_OK:"GTM Approved", PENDING_AV:"Send to AV's Approval" },
  STATUS:{ DRAFT:"Draft", SUBMITTED:"Submitted", REJECTED:"Rejected", RESUBMITTED:"Resubmitted" }
};
const C = {status:"Status", tag:"Event_Tag", remarks:"Rejection_Remarks", district:"District", zh:"ZH", raisedBy:"Raised_by", number:"Event_Number"};
const ATTENDEE = ["25 + KDMs","50 + KDMs","100 + KDMs","150 + KDMs","200 + KDMs","250 + KDMs","400 + KDMs","500 + KDMs"];
const STATES = ["Andaman & Nicobar (UT)","Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chandigarh (UT)","Chhattisgarh","Dadra & Nagar Haveli (UT) and Daman & Diu (UT)","Delhi","Goa","Gujarat","Haryana","Himachal Pradesh","Jammu & Kashmir(UT)","Jharkhand","Karnataka","Kerala","Ladakh (UT)","Lakshadweep (UT)","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Nepal","Odisha","Puducherry (UT)","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal"];
const CATS = ["End Customer Event","Partner Event","Partner Branding"], EC_SUBS = ["Sponsored Event","Co-Sponsored Event"];
// k = key in the form, g = GTM field, m = Marketing field
const NOT_BRANDING = ()=>V.cat!=="Partner Branding";
const COUNTRIES = ["India","Phillipines","Saudi Arabia"];
const FIELDS = [
  {sec:"secType", k:"cat", label:"Event category", g:"Event_Category", m:"Event_Category", type:"category", req:true},
  {sec:"secType", k:"sub", label:"Event sub type", g:"Event_Sub_Type", m:"Event_Sub_Type", type:"subtype", req:true, show:()=>V.cat && V.cat!=="Partner Branding"},
  {sec:"secType", k:"date", label:"Event date", g:"Event_Date", m:"Event_Date", type:"date", req:true, show:NOT_BRANDING},
  {sec:"secBasic", k:"partner", label:"Partner name", g:"Partner", m:"Partner", type:"lookup", req:true, show:()=>V.cat==="Partner Event"||V.sub==="Co-Sponsored Event"},
  {sec:"secBasic", k:"firm", label:"Firm name", g:"Firm_Name", m:"Firm_Name", type:"lookup", req:true, show:()=>V.cat==="Partner Branding"},
  {sec:"secBasic", k:"logo", label:"Firm logo", g:"Logo", m:"Logo", type:"file", accept:"image/*", show:()=>V.cat==="Partner Branding"},
  {sec:"secBasic", k:"poc", label:"Firm POC name", g:"Partner_POC_Name", m:"Partner_POC_Name", type:"text", req:true, show:()=>V.cat==="Partner Branding"},
  {sec:"secBasic", k:"pocm", label:"Firm mobile number", g:"POC_Mobile_Number", m:"POC_Mobile_Number", type:"phone", req:true, show:()=>V.cat==="Partner Branding"},
  {sec:"secBasic", k:"faddr", label:"Firm address", g:"Firm_Address", m:"Firm_Address", type:"textarea", req:true, show:()=>V.cat==="Partner Branding"},
  {sec:"secBasic", k:"map", label:"Google Map location", type:"map", show:()=>V.cat==="Partner Branding"},
  {sec:"secBasic", k:"more", label:"Additional details", g:"More_Details", m:"More_Details", type:"textarea", show:()=>V.cat==="Partner Branding"},
  {sec:"secBasic", k:"share", label:"Partner contribution %", g:"Partner_s_Contribution", m:"Partner_s_Contribution", type:"percent", req:true, show:()=>V.sub==="Co-Sponsored Event"},
  {sec:"secBasic", k:"name", label:"Event name", g:"Name", m:"Name", type:"text", req:true, ph:"e.g. Education Excellence Conclave – Jammu", show:NOT_BRANDING},
  {sec:"secBasic", k:"attendee", label:"Expected attendee", g:"Expected_Attendee", m:"Expected_Attendee", type:"select", options:ATTENDEE, req:true, show:NOT_BRANDING},
  {sec:"secBasic", k:"address", label:"Venue", g:"Address", m:"Address", type:"textarea", req:true, show:NOT_BRANDING},
  {sec:"secBasic", k:"city", label:"City", g:"City", m:"City", type:"citylk", req:true, show:NOT_BRANDING},
  {sec:"secBasic", k:"pin", label:"Pin code", g:"Pin_Code", m:"Pin_Code", type:"pinlk", req:true, show:NOT_BRANDING},
  {sec:"secBasic", k:"state", label:"State", g:"State", m:"State", type:"auto", req:true, show:NOT_BRANDING},
  {sec:"secBasic", k:"fpin", label:"Zip code", g:"Zip_Code", m:"Zip_Code", type:"pinlk", req:true, show:()=>V.cat==="Partner Branding"},
  {sec:"secBasic", k:"fcity", label:"City", g:"City1", m:"City1", type:"citylk", req:true, show:()=>V.cat==="Partner Branding"},
  {sec:"secBasic", k:"fstate", label:"State", g:"State1", m:"State1", type:"auto", req:true, show:()=>V.cat==="Partner Branding"},
  {sec:"secBasic", k:"country", label:"Country", g:"Country", m:"Country", type:"select", options:COUNTRIES, req:true, show:NOT_BRANDING},
  {sec:"secBasic", k:"agenda", label:"Event proposal", g:"Event_Agenda", m:"Event_Agenda", type:"file", show:NOT_BRANDING},
  {sec:"secBasic", k:"photos", label:"Other attachments", g:"Photographs", m:"Photographs", type:"file", multiple:true, show:NOT_BRANDING},
  {sec:"secBasic", k:"other", label:"Additional event details", g:"Other_Details", m:"Other_Details", type:"textarea", show:NOT_BRANDING},
  {sec:"secOther", k:"spons", label:"Sponsorship cost", g:"Event_s_Sponsorship_Cost", m:"Sponsorship_Cost", type:"money", req:true, show:NOT_BRANDING},
  {sec:"secOther", k:"pshare", label:"Teachmint share", g:"Teachmint_Share_Percent", m:"Teachmint_Share_Percent", type:"pshare", req:true, show:()=>V.cat==="Partner Event" && S.role==="MKT"},
  {sec:"secOther", k:"recce", label:"Site recce report", g:"Site_recce_Report", m:"Site_recce_Report", type:"file", show:()=>V.cat==="Partner Branding"},
  {sec:"secOther", k:"vendor", label:"Vendor name", g:"Vendor_Name", m:"Vendor_Name", type:"text", req:true, show:()=>V.cat==="Partner Branding"},
  {sec:"secOther", k:"quote", label:"Quoted amount", g:"Quoted_Amount", m:"Quoted_Amount", type:"money", req:true, show:()=>V.cat==="Partner Branding"},
  {sec:"secOther", k:"prod", label:"Production cost", g:"Event_s_Production_Cost", m:"Production_Cost", type:"money", help:"Booth branding, standees, branding", show:NOT_BRANDING},
  {sec:"secOther", k:"proc", label:"Procurement cost", g:"Event_s_Procurement_Cost", m:"Procurement_Cost", type:"money", help:"Brochures, merchandise, bags, gifts", show:NOT_BRANDING},
];
const SHARE = {type:{g:"Share_Type", m:"Share_Type"}, amt:{g:"Teachmint_Share_Amount", m:"Teachmint_Share_Amount"}, PCT:"Percentage (%)", AMT:"Amount (in Rs)"};   // filled with the district name
const byK = k => FIELDS.find(f=>f.k===k);
// width of each field on a 4-column grid
const W = {firm:4, logo:2, poc:3, pocm:3, faddr:6, more:6, vendor:3, quote:3, recce:6, map:6, cat:2, sub:2, date:2, name:4, address:6, city:2, pin:1, state:2, country:1, partner:4, share:2, agenda:3, photos:3, other:6, attendee:2, spons:2, prod:2, proc:2};
const TAB_OF = sec => sec==="secOther" ? "cost" : "event";

/* ============ STATE ============ */
const S = {shareMode:"%", live:false, role:"MKT", user:{id:null,name:""}, recordId:null, rec:{}, files:{}, owner:null, zh:null, districtName:"", districtId:null, pin:"idle", ownerDirty:false, prefilled:false, busy:false, view:"list", tab:"event", tl:null, tlAll:false};
let V = {};   // the one set of values shown in the form
const side = () => S.role==="MKT" ? "m" : "g";
const other = () => S.role==="MKT" ? "g" : "m";

/* ============ DATA (Zoho SDK, or preview data) ============ */
const MOCK = {
  pins:{"180001":{district:{id:"d1",name:"Jammu"},state:"Jammu & Kashmir(UT)",zone:"North 1",owner:{id:"u1",name:"District owner, Jammu"}},
        "560001":{district:{id:"d2",name:"Bengaluru Urban"},state:"Karnataka",zone:"South",owner:{id:"u2",name:"District owner, Bengaluru"}}},
  partners:[{id:"p1",Account_Name:"Brightpath Learning Solutions"},{id:"p2",Account_Name:"Kashmir Edu Systems"}],
  rows:[], n:0, hist:{},
  cities:[{id:"c1",Name:"Jammu",State:{name:"Jammu & Kashmir"}},{id:"c2",Name:"Bengaluru",State:{name:"Karnataka"}},{id:"c3",Name:"Kanpur",State:{name:"Uttar Pradesh"}},{id:"c4",Name:"Pune",State:{name:"Maharashtra"}}],
  pincodes:[{id:"p180001",Name:"180001",District:{id:"d1",name:"Jammu"}},{id:"p180004",Name:"180004",District:{id:"d1",name:"Jammu"}},{id:"p560001",Name:"560001",District:{id:"d2",name:"Bengaluru Urban"}},{id:"p208001",Name:"208001",District:{id:"d3",name:"Kanpur Nagar"}}],
  districts:[{id:"d1",name:"Jammu",state:"Jammu & Kashmir(UT)",zone:"North 1",owner:{id:"u1",name:"District owner, Jammu"}},{id:"d2",name:"Bengaluru Urban",state:"Karnataka",zone:"South",owner:{id:"u2",name:"District owner, Bengaluru"}},{id:"d3",name:"Kanpur Nagar",state:"Uttar Pradesh",zone:"North 2",owner:{id:"u3",name:"District owner, Kanpur"}},{id:"d4",name:"Pune",state:"Maharashtra",zone:"West",owner:{id:"u4",name:"District owner, Pune"}}]
};
const API = {
  async me(){
    if(!S.live) return {role:S.role, id:"me", name:S.role==="MKT"?"Preview Marketing user":"Preview GTM user"};
    const r = await ZOHO.CRM.CONFIG.getCurrentUser(); const u = (r&&r.users&&r.users[0])||{};
    const hay = (((u.role||{}).name||"")+" "+((u.profile||{}).name||"")).toLowerCase();
    return {role:CFG.MARKETING_KEYWORDS.some(w=>hay.includes(w))?"MKT":"GTM", id:u.id, name:u.full_name||""};
  },
  async list(f){
    if(!S.live){ await wait(150); return {rows:MOCK.rows.filter(r=>matches(r,f)).map(r=>structuredClone(r)), more:false}; }
    const crit = criteria(f);
    const r = crit
      ? await ZOHO.CRM.API.searchRecord({Entity:CFG.MODULE, Type:"criteria", Query:crit, page:f.page, per_page:20})
      : await ZOHO.CRM.API.getAllRecords({Entity:CFG.MODULE, sort_order:"desc", page:f.page, per_page:20});
    return {rows:(r&&r.data)||[], more:!!(r&&r.info&&r.info.more_records)};
  },
  async load(id){
    if(!S.live) return structuredClone(MOCK.rows.find(r=>r.id===id)||{});
    const r = await ZOHO.CRM.API.getRecord({Entity:CFG.MODULE, RecordID:id}); return (r&&r.data&&r.data[0])||{};
  },
  async timeline(id){
    if(!S.live) return structuredClone(MOCK.hist[id]||[]);
    const r = await ZOHO.CRM.API.getRelatedRecords({Entity:CFG.MODULE, RecordID:id, RelatedList:"__timeline", page:1, per_page:50});
    return (r && (r.__timeline || r.data)) || [];
  },
  async districts(){
    if(!S.live) return MOCK.districts;
    const out = [];
    for(let page=1; page<=10; page++){
      const r = await ZOHO.CRM.API.getAllRecords({Entity:CFG.DISTRICT_MODULE, sort_order:"asc", page, per_page:200});
      (r&&r.data||[]).forEach(d=>out.push({id:d.id, name:d.Name, state:d.State||"", zone:d.Zone||"", owner:d.Owner?{id:d.Owner.id,name:d.Owner.name}:null}));
      if(!(r&&r.info&&r.info.more_records)) break;
    }
    return out.sort((a,b)=>a.name.localeCompare(b.name));
  },
  async lookupSearch(kind,q){
    if(!S.live){ await wait(150); const src = kind==="city" ? MOCK.cities : MOCK.pincodes; return src.filter(r=>r.Name.toLowerCase().startsWith(q.toLowerCase())).slice(0,20); }
    const mod = kind==="city" ? "Cities" : CFG.PINCODE_MODULE, t = q.replace(/[(),]/g,"\\$&");
    const r = await ZOHO.CRM.API.searchRecord({Entity:mod, Type:"criteria", Query:"(Name:starts_with:"+t+")", per_page:20});
    return (r&&r.data)||[];
  },
  async district(id){
    if(!S.live) return MOCK.districts.find(d=>d.id===id)||null;
    const r = await ZOHO.CRM.API.getRecord({Entity:CFG.DISTRICT_MODULE, RecordID:id}); const d = r&&r.data&&r.data[0]; if(!d) return null;
    return {id:d.id, name:d.Name, zone:d.Zone||"", owner:d.Owner?{id:d.Owner.id,name:d.Owner.name}:null};
  },
  async pincode(pin){
    if(!S.live){ await wait(300); return MOCK.pins[pin]||null; }
    const r = await ZOHO.CRM.API.searchRecord({Entity:CFG.PINCODE_MODULE, Type:"criteria", Query:"(Name:equals:"+pin+")"});
    const p = r&&r.data&&r.data[0]; if(!p||!p.District) return null;
    const d = await ZOHO.CRM.API.getRecord({Entity:CFG.DISTRICT_MODULE, RecordID:p.District.id});
    const dist = d&&d.data&&d.data[0]; if(!dist||!dist.Owner) return null;
    return {district:{id:dist.id,name:dist.Name}, state:dist.State||"", zone:dist.Zone||"", owner:{id:dist.Owner.id,name:dist.Owner.name}};
  },
  async partners(q){
    if(!S.live){ await wait(150); return MOCK.partners.filter(p=>p.Account_Name.toLowerCase().includes(q.toLowerCase())); }
    const r = await ZOHO.CRM.API.searchRecord({Entity:CFG.PARTNER_MODULE, Type:"word", Query:q}); return (r&&r.data)||[];
  },
  async save(data){
    if(!S.live){
      await wait(300);
      for(const [a,fs] of Object.entries(S.files)) data[a] = fs.map(f=>({File_Name__s:f.name}));
      if(data.Owner && S.owner) data.Owner = Object.assign({},S.owner);
      if(data[C.zh] && S.zh) data[C.zh] = Object.assign({},S.zh);
      if(data[C.district]) data[C.district] = {id:S.districtId, name:S.districtName};
      if(data[C.raisedBy]) data[C.raisedBy] = {id:"me", name:S.user.name};
      let row = MOCK.rows.find(r=>r.id===S.recordId);
      if(!row){ MOCK.n++; row = {id:"demo-"+MOCK.n, [C.number]:"ME - "+String(MOCK.n).padStart(4,"0"), [C.raisedBy]:{id:"me",name:S.user.name}}; MOCK.rows.unshift(row); }
      ["partner","firm","city","pin","fcity","fpin"].forEach(k=>{ const api = byK(k).m; if(data[api] && V[k]) data[api] = {id:V[k].id, name:V[k].name}; });
      const before = structuredClone(row), now = new Date().toISOString(), isNew = !before.Name;
      Object.assign(row, structuredClone(data), {Modified_By:{name:S.user.name}, Modified_Time:now}); if(isNew){ row.Created_By = {name:S.user.name}; row.Created_Time = now; }
      const fh = isNew ? [] : Object.keys(data).filter(k=>JSON.stringify(before[k]??null)!==JSON.stringify(row[k]??null) && !["Owner","ZH","District","Name"].includes(k)).map(k=>({field_label:(FIELDS.find(f=>f.g===k||f.m===k)||{label:k}).label||k, _value:{old:before[k], new:row[k]}}));
      (MOCK.hist[row.id] = MOCK.hist[row.id]||[]).push({done_by:{name:S.user.name}, audited_time:now, action:isNew?"added":"updated", field_history:fh});
      return row.id;
    }
    for(const [a,fs] of Object.entries(S.files)){
      const ids = [];
      for(const f of fs){
        const u = await ZOHO.CRM.API.uploadFile({CONTENT_TYPE:"multipart", PARTS:[{headers:{"Content-Disposition":"file;"},content:"__FILE__"}], FILE:{fileParam:"content", file:f}});
        const row = u&&u.data&&u.data[0]; if(!row||!row.details) throw new Error("File upload failed: "+f.name); ids.push({file_id:row.details.id});
      }
      if(ids.length) data[a] = ids;
    }
    const r = S.recordId
      ? await ZOHO.CRM.API.updateRecord({Entity:CFG.MODULE, APIData:Object.assign({id:S.recordId},data), Trigger:["workflow"]})
      : await ZOHO.CRM.API.insertRecord({Entity:CFG.MODULE, APIData:data, Trigger:["workflow"]});
    const row = r&&r.data&&r.data[0];
    if(!row||row.code!=="SUCCESS") throw new Error((row&&(row.message+(row.details&&row.details.api_name?" ("+row.details.api_name+")":"")))||"CRM did not accept the record");
    return S.recordId || row.details.id;
  }
};
const wait = ms => new Promise(r=>setTimeout(r,ms));

/* ============ HELPERS ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v==null?"":v).replace(/,/g,"")); return isNaN(n)?0:n; };
const has = v => Array.isArray(v) ? v.length>0 : (v&&typeof v==="object") ? !!v.id : (v!==undefined&&v!==null&&String(v).trim()!=="");
const inr = n => "₹"+Math.round(n).toLocaleString("en-IN");
const shown = f => !f.show || f.show();
const fileNames = v => Array.isArray(v) ? v.map(x=>x.File_Name__s||x.name||"file").join(", ") : "";
function ordinalDate(iso){ if(!iso) return ""; const d = new Date(iso+"T00:00:00"); if(isNaN(d)) return iso; const n=d.getDate(), s=(n%10===1&&n!==11)?"st":(n%10===2&&n!==12)?"nd":(n%10===3&&n!==13)?"rd":"th"; return n+s+" "+d.toLocaleString("en-GB",{month:"long"})+" "+d.getFullYear(); }
function lakhs(n){ return n>=1e7 ? "₹"+(+(n/1e7).toFixed(2))+" Cr" : n>=1e5 ? "₹"+(+(n/1e5).toFixed(2))+" lakh" : inr(n); }
const money = v => Math.round(num(v)).toLocaleString("en-IN");   // 40000 → 40,000
function teachmintSponsorship(){
  const spons = num(V.spons);
  if(S.role!=="MKT") return spons;
  if(V.cat==="Partner Event"){
    if(S.shareMode==="₹" && has(V.pshareAmt)) return Math.min(num(V.pshareAmt), spons||Infinity);
    return has(V.pshare) ? spons*Math.min(100,num(V.pshare))/100 : spons;
  }
  return spons;
}
function calc(){
  const ours = teachmintSponsorship(), total = ours + num(V.prod) + num(V.proc);
  let commit = "–";
  if(total && V.cat==="Partner Event") commit = lakhs(total*CFG.PARTNER_MULTIPLIER)+" billing";
  else if(total && V.cat==="End Customer Event") commit = Math.ceil(total/CFG.CAC)+" IFP";
  return {ours, total, commit, founder: total>CFG.FOUNDER_LIMIT};
}

/* ============ WHO CAN DO WHAT ============ */
function perms(){
  const st = S.rec[C.status]||"", tag = S.rec[C.tag]||"", isNew = !S.recordId, p = {edit:false, actions:[], note:""};
  if(S.role==="MKT"){
    if(isNew || st===CFG.STATUS.DRAFT || st===CFG.STATUS.REJECTED){ p.edit = true; p.actions = ["save","submit"]; p.note = st===CFG.STATUS.REJECTED ? "Rejected by the ZH. Update and resubmit." : "Save a draft anytime. Submit sends the details to the ZH by email."; }
    else if(tag===CFG.TAG.PENDING_ZH){ p.actions = ["zhReject","zhApprove"]; p.note = "Waiting for the ZH’s email reply. Record their decision here."; }
    else if(tag===CFG.TAG.ZH_OK){ p.actions = ["sendAV"]; p.note = "ZH approved. Send it to AV."+(calc().founder?" Above ₹50,000, so Divyansh approves after AV.":""); }
    else p.note = tag===CFG.TAG.PENDING_AV ? "With AV for approval." : "Read-only.";
  } else {
    if(isNew || st===CFG.STATUS.DRAFT){ p.edit = true; p.actions = ["save"]; p.note = isNew ? "Fill the event details and save. Marketing takes it forward." : "You can update your proposal until Marketing submits."; }
    else p.note = tag===CFG.TAG.PENDING_ZH ? "Sent to the ZH for approval." : tag===CFG.TAG.ZH_OK ? "Approved by the ZH." : tag===CFG.TAG.PENDING_AV ? "With AV for approval." : st===CFG.STATUS.REJECTED ? "Rejected by the ZH. Marketing is revising it." : "Read-only.";
  }
  return p;
}

/* ============ SAVE ============ */
function missing(){
  const out = []; S.firstMissing = null;
  for(const f of FIELDS){ if(!f.req || !shown(f)) continue; if(f.k==="pshare" && S.shareMode==="₹" && has(V.pshareAmt)) continue; if(f.k==="sub" && V.cat==="Partner Event") continue; if(!has(V[f.k])){ out.push(f.label.toLowerCase()); if(!S.firstMissing) S.firstMissing = f; } }
  ["pin","fpin"].forEach(k=>{ if(shown(byK(k)) && !has(V[k]) && has(V["_lq_"+k])) out.push("a pin code from the list"); });
  if(shown(byK("pocm")) && has(V.pocm) && String(V.pocm).replace(/\D/g,"").length<10) out.push("a 10-digit POC mobile number");
  return out;
}
function fail(list){ if(S.firstMissing){ const t = TAB_OF(S.firstMissing.sec); if(t!==S.tab){ S.tab = t; render(); } const el = $("f_"+S.firstMissing.k); el && el.focus(); S.firstMissing = null; } $("msg").textContent = "Add "+list.join(", ")+" to continue."; $("msg").classList.add("err"); }
function payload(){
  const o = {}, s = side();
  for(const f of FIELDS){
    if(f.type==="file" || f.type==="district" || f.type==="map") continue;
    if(f.type==="citylk"||f.type==="pinlk"){ o[f[s]] = V[f.k]&&V[f.k].id ? {id:V[f.k].id} : null; continue; }
    if(!shown(f) && f.k!=="sub"){ continue; }
    let v = V[f.k];
    if(f.k==="sub" && V.cat==="Partner Event") v = "Partner Enablement Event";
    if(f.type==="lookup") v = v&&v.id ? {id:v.id} : null;
    else if(f.type==="money"||f.type==="percent"||f.type==="pshare") v = has(v) ? +num(v).toFixed(2) : null;
    else if(!has(v)) v = null;
    o[f[s]] = v;
  }
  if(V.cat==="Partner Event" && S.role==="MKT"){
    const amt = S.shareMode==="₹";
    o[SHARE.type[s]] = amt ? SHARE.AMT : SHARE.PCT;
    o[SHARE.amt[s]] = amt && has(V.pshareAmt) ? num(V.pshareAmt) : null;
    o[byK("pshare")[s]] = amt ? null : (has(V.pshare) ? +num(V.pshare).toFixed(2) : null);
  }
  o[CFG.MAP_FIELD] = has(V.map) ? String(V.map).trim() : null;
  if(S.districtId) o[C.district] = {id:S.districtId};
  if(V.cat==="Partner Branding") o[byK("sub")[s]] = null;
  o.Name = V.cat==="Partner Branding" ? "Partner Branding – "+((V.firm&&V.firm.name)||(V.fcity&&V.fcity.name)||"") : (V.name || "Event request");
  if(S.ownerDirty || !S.recordId){
    if(S.owner) o.Owner = {id:S.owner.id};
    if(S.zh) o[C.zh] = {id:S.zh.id};
  }
  if(!S.recordId && S.user.id) o[C.raisedBy] = {id:S.user.id};
  const files = {}; for(const f of FIELDS) if(f.type==="file" && S.files[f.k] && S.files[f.k].length) files[f[s]] = S.files[f.k];
  S.filesBySide = files;
  return o;
}
async function commit(data, okText){
  S.busy = true; render();
  try{
    const keep = S.files; S.files = S.filesBySide || {};
    S.recordId = await API.save(data); S.files = {}; S.filesBySide = null; S.ownerDirty = false;
    const fresh = await API.load(S.recordId); if(fresh && fresh.id) loadRecord(fresh);
    toast(okText);
  }catch(err){ $("msg").textContent = "Couldn’t save: "+(err.message||err); $("msg").classList.add("err"); }
  S.busy = false; render();
}
const ACT = {
  async save(){ if(S.role==="MKT"){ if(!has(V.cat)) return fail(["event category"]); if(V.cat!=="Partner Branding" && !has(V.name)) return fail(["event name"]); } else { const e = missing(); if(e.length) return fail(e); }
    const o = payload(); if(!S.recordId) o[C.status] = CFG.STATUS.DRAFT; await commit(o, S.role==="MKT"?"Draft saved.":"Saved. Marketing can take it forward."); },
  async submit(){ const e = missing(); if(e.length) return fail(e);
    const re = S.rec[C.status]===CFG.STATUS.REJECTED || S.rec[C.status]===CFG.STATUS.RESUBMITTED;
    const o = payload(); o[C.status] = re ? CFG.STATUS.RESUBMITTED : CFG.STATUS.SUBMITTED; o[C.tag] = CFG.TAG.PENDING_ZH;
    await commit(o, re?"Resubmitted. The ZH gets the email.":"Submitted. The ZH gets the email."); },
  async zhApprove(){ await commit({[C.tag]:CFG.TAG.ZH_OK, [C.remarks]:null}, "Marked as approved by the ZH."); },
  async zhReject(){ const rm = $("remarks").value.trim(); if(!rm){ $("remarks").focus(); return fail(["the ZH’s remarks"]); }
    await commit({[C.tag]:null, [C.status]:CFG.STATUS.REJECTED, [C.remarks]:rm}, "Marked as rejected. You can now update and resubmit."); },
  async sendAV(){ await commit({[C.tag]:CFG.TAG.PENDING_AV}, "Sent to AV."); }
};

/* ============ LOAD A RECORD INTO THE ONE-SET FORM ============ */
function loadRecord(rec){
  S.recordId = rec.id; S.rec = rec; V = {}; S.prefilled = false;
  const s = side(), o = other();
  for(const f of FIELDS){
    let v = rec[f[s]];
    if(!has(v) && has(rec[f[o]]) && f.type!=="file" && perms().edit){ v = rec[f[o]]; S.prefilled = true; }   // first time: start from the other side’s values
    V[f.k] = v==null ? "" : v;
  }
  V.map = rec[CFG.MAP_FIELD] || "";
  { const sd = has(rec[SHARE.type[s]]) || has(rec[SHARE.amt[s]]) ? s : o;   // same prefill rule as other fields
    S.shareMode = rec[SHARE.type[sd]]===SHARE.AMT ? "₹" : "%"; V.pshareAmt = has(rec[SHARE.amt[sd]]) ? String(Math.round(num(rec[SHARE.amt[sd]]))) : ""; }
  if(rec.Owner) S.owner = {id:rec.Owner.id, name:rec.Owner.name};
  if(rec[C.zh]) S.zh = {id:rec[C.zh].id, name:rec[C.zh].name};
  if(rec[C.district]){ S.districtName = rec[C.district].name; S.districtId = rec[C.district].id; V.district = {id:rec[C.district].id, name:rec[C.district].name}; }
  S.pin = has(V.pin) && S.owner ? "found" : "idle";
  render(); loadTimeline(rec.id);
}

  const set = e.target.closest("[data-set]");
  if(set){ V[set.dataset.set] = set.dataset.val; if(set.dataset.set==="cat"){ if(V.cat==="Partner Event") V.sub = "Partner Enablement Event"; else if(V.cat==="Partner Branding" || !EC_SUBS.includes(V.sub)) V.sub = ""; } clearErr(); render(); return; }
  const sm = e.target.closest("[data-smode]"); if(sm){ const m = sm.dataset.smode; if(m!==S.shareMode){ if(m==="₹") V.pshareAmt = has(V.pshare)&&num(V.spons) ? String(Math.round(num(V.spons)*num(V.pshare)/100)) : ""; S.shareMode = m; render(); } return; }
  const tb = e.target.closest("[data-tab]"); if(tb){ S.tab = tb.dataset.tab; render(); return; }
  if(e.target.closest("#tlToggle")){ S.tlAll = !S.tlAll; renderTimeline(); return; }
  const act = e.target.closest("[data-act]"); if(act && !act.disabled){ clearErr(); ACT[act.dataset.act](); return; }
  if(e.target.closest("#locBtn")){ useMyLocation(); return; }
  const lp = e.target.closest("[data-lpick]"); if(lp){ lookupPick(lp.dataset.lpick, lp.dataset.id); return; }
  const dk = e.target.closest("[data-dpick]"); if(dk){ pickDistrict(dk.dataset.dpick); return; }
  if(e.target.closest("#f_district")){ showDistricts(e.target.value||""); return; }
  const pk = e.target.closest("[data-pick]"); if(pk){ V[pk.dataset.fk] = {id:pk.dataset.pick, name:pk.dataset.name}; V["_pq_"+pk.dataset.fk] = ""; clearErr(); render(); return; }
  const o = e.target.closest("[data-open]"); if(o){ openRecord(o.dataset.open); return; }
  const fb = e.target.closest("[data-filter]"); if(fb){ L.filter = fb.dataset.filter; L.page = 1; loadList(); return; }
  if(e.target.closest("#newBtn")){ newRecord(); return; }
  if(e.target.closest("#backBtn")){ showList(); return; }
  if(e.target.closest("#prevPg")){ if(L.page>1){ L.page--; loadList(); } return; }
  if(e.target.closest("#nextPg")){ if(L.more){ L.page++; loadList(); } return; }
  const role = e.target.closest("[data-role]"); if(role){ setRole(role.dataset.role); return; }
  document.querySelectorAll('[id^="pl_"]').forEach(u=>u.classList.add("hidden"));
  const dl = $("dl"); if(dl) dl.classList.add("hidden");
  document.querySelectorAll('[id^="ll_"]').forEach(u=>u.classList.add("hidden"));
});
document.addEventListener("input", e=>{
  const k = e.target.dataset && e.target.dataset.k;
  if(e.target.id==="f_pshare"){
    if(S.shareMode==="₹"){ const d = e.target.value.replace(/\D/g,""); V.pshareAmt = d; e.target.value = d ? money(d) : ""; }
    else { let d = e.target.value.replace(/[^\d.]/g,""); if(num(d)>100) d = "100"; V.pshare = d; e.target.value = d; }
    clearErr(); softEnd(); return;
  }
  if(k && e.target.tagName!=="SELECT" && byK(k) && byK(k).type==="money"){
    const d = e.target.value.replace(/\D/g,""); V[k] = d; e.target.value = d ? money(d) : "";
    clearErr(); softEnd(); return;
  }
  if(k==="pocm"){ e.target.value = e.target.value.replace(/[^\d+]/g,"").slice(0,13); }
  if(k && e.target.tagName!=="SELECT"){ let v = e.target.value; if(k==="pin"){ v = v.replace(/\D/g,"").slice(0,6); e.target.value = v; } V[k] = v; clearErr(); soft(); return; }
  if(e.target.dataset && e.target.dataset.pq) onPartner(e.target.dataset.pq, e.target.value);
  if(e.target.dataset && e.target.dataset.lq){ if(kindOf(e.target.dataset.lq)==="pin") e.target.value = e.target.value.replace(/\D/g,"").slice(0,6); lookupQuery(e.target.dataset.lq, e.target.value); }
  if(e.target.dataset && e.target.dataset.dq){ V._dq = e.target.value; V.district = null; showDistricts(e.target.value); }
  if(e.target.id==="f_share"){ e.target.value = e.target.value.replace(/\D/g,"").slice(0,2); V.share = e.target.value; }
  if(e.target.id==="q"){ clearTimeout(qT); qT = setTimeout(()=>{ L.q = e.target.value; L.page = 1; loadList(); },350); }
});
document.addEventListener("change", e=>{
  const fk = e.target.dataset && e.target.dataset.file; if(fk) S.files[fk] = Array.from(e.target.files||[]);
  if(e.target.tagName==="SELECT" && e.target.dataset.k){
    const k = e.target.dataset.k; V[k] = e.target.value;
    if(k==="cat") resetForCategory(V.cat);
    clearErr(); soft();
  }
});
function softEnd(){ const el = document.activeElement, id = el&&el.id; render(); if(id && $(id)){ const x = $(id); x.focus(); try{ x.setSelectionRange(x.value.length, x.value.length); }catch(_){} } }
function soft(){ const el = document.activeElement, id = el&&el.id, pos = el&&el.selectionStart; render(); if(id && $(id)){ $(id).focus(); try{ if(pos!=null) $(id).setSelectionRange(pos,pos); }catch(_){} } }
function clearErr(){ $("msg").classList.remove("err"); }
function useMyLocation(){
  if(!navigator.geolocation){ $("msg").textContent = "Location isn’t available here. Paste the Google Maps link instead."; $("msg").classList.add("err"); return; }
  $("msg").textContent = "Getting your location…";
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:a, longitude:b} = pos.coords;
    V.map = "https://www.google.com/maps?q="+a.toFixed(6)+","+b.toFixed(6); clearErr(); render();
  }, ()=>{ $("msg").textContent = "Couldn’t get your location (permission blocked). Paste the Google Maps link instead."; $("msg").classList.add("err"); }, {enableHighAccuracy:true, timeout:10000});
}
const STATE_FIX = {"Andaman & Nicobar":"Andaman & Nicobar (UT)","Chandigarh":"Chandigarh (UT)","Jammu & Kashmir":"Jammu & Kashmir(UT)","Ladakh":"Ladakh (UT)","Lakshadweep":"Lakshadweep (UT)","Puducherry":"Puducherry (UT)"};
const toState = st => { const t = String(st||"").trim(); if(/^Uttar Pradesh\s*\d+$/i.test(t)) return "Uttar Pradesh"; return STATE_FIX[t] || t; };
/* Changing the category clears every field on both tabs */
function resetForCategory(cat){
  const had = Object.keys(V).some(x=>x!=="cat" && x!=="country" && has(V[x]));
  V = {cat, country:"India"}; if(cat==="Partner Event") V.sub = "Partner Enablement Event";
  S.files = {}; S.shareMode = "%"; S.owner = null; S.zh = null; S.districtId = null; S.districtName = ""; S.ownerDirty = true; S.prefilled = false; S.tab = "event";
  render(); if(had) toast("Category changed, so the other fields were cleared.");
}
/* City → State, Pin code → District (hidden) → Owner + ZH */
let lqT; const LQ = {};
const STATE_OF = {city:"state", fcity:"fstate"};
const kindOf = k => byK(k).type==="citylk" ? "city" : "pin";
function lookupQuery(k,q){
  const kind = kindOf(k);
  V["_lq_"+k] = q; V[k] = null; if(STATE_OF[k]) V[STATE_OF[k]] = ""; clearTimeout(lqT);
  const u = $("ll_"+k); if(!u) return;
  if(q.trim().length < (kind==="pin"?3:2)){ u.classList.add("hidden"); return; }
  lqT = setTimeout(async ()=>{
    let rows = []; try{ rows = await API.lookupSearch(kind, q.trim()); }catch(_){}
    LQ[k] = rows; const ul = $("ll_"+k); if(!ul) return;
    ul.innerHTML = rows.length ? rows.map(r=>`<li><button type="button" data-lpick="${k}" data-id="${esc(r.id)}">${esc(r.Name)} <span class="sub">· ${esc(kind==="city" ? toState(r.State&&r.State.name) : (r.District&&r.District.name)||"")}</span></button></li>`).join("") : `<li class="sub" style="padding:7px 8px">No ${kind==="city"?"city":"pin code"} matches “${esc(q)}”</li>`;
    ul.classList.remove("hidden");
  },250);
}
async function lookupPick(k,id){
  const r = (LQ[k]||[]).find(x=>x.id===id); if(!r) return;
  V[k] = {id:r.id, name:r.Name}; V["_lq_"+k] = "";
  if(STATE_OF[k]) V[STATE_OF[k]] = toState(r.State&&r.State.name);
  if(kindOf(k)==="pin" && r.District){
    S.districtId = r.District.id; S.districtName = r.District.name; S.ownerDirty = true; render();
    try{ const d = await API.district(r.District.id); if(d){ S.owner = d.owner; const z = CFG.ZH_BY_ZONE[d.zone]; S.zh = z ? Object.assign({},z) : null; } }catch(_){}
  }
  clearErr(); render();
}
/* District picker: owner, ZH and state come from the chosen district */
let DIST = null;
async function ensureDistricts(){ if(DIST) return; try{ DIST = await API.districts(); }catch(_){ DIST = []; } if(S.view==="form") soft(); }
function showDistricts(q){
  const u = $("dl"); if(!u) return;
  if(!DIST){ u.innerHTML = `<li class="sub" style="padding:7px 8px">Loading districts…</li>`; u.classList.remove("hidden"); return; }
  const t = q.trim().toLowerCase();
  const list = DIST.filter(d=>!t || d.name.toLowerCase().includes(t)).slice(0,30);
  u.innerHTML = list.length ? list.map(d=>`<li><button type="button" data-dpick="${esc(d.id)}">${esc(d.name)} <span class="sub">· ${esc(toState(d.state))}</span></button></li>`).join("") : `<li class="sub" style="padding:7px 8px">No district matches “${esc(q)}”</li>`;
  u.classList.remove("hidden");
}
function pickDistrict(id){
  const d = (DIST||[]).find(x=>x.id===id); if(!d) return;
  V.district = {id:d.id, name:d.name}; V._dq = ""; V.state = toState(d.state); S.districtName = d.name; S.districtId = d.id;
  if(S.role==="MKT" || !S.rec.Owner){ S.owner = d.owner; const z = CFG.ZH_BY_ZONE[d.zone]; S.zh = z ? Object.assign({},z) : null; S.ownerDirty = true; }
  clearErr(); render();
}
let pinSeq = 0;
async function onPin(pin){
  if(pin.length!==6){ S.pin = "idle"; return; }
  const seq = ++pinSeq; S.pin = "loading"; soft();
  try{
    const r = await API.pincode(pin); if(seq!==pinSeq) return;
    if(!r) S.pin = "missing";
    else{
      S.pin = "found"; if(r.state) V.state = r.state; if(!has(V.city)) V.city = r.district.name;
      // Marketing’s pin decides the owner; a GTM pin is used until Marketing enters one
      if(S.role==="MKT" || !has(S.rec.Pin_code)){ S.owner = r.owner; S.districtName = r.district.name; S.districtId = r.district.id; const z = CFG.ZH_BY_ZONE[r.zone]; S.zh = z ? Object.assign({},z) : null; S.ownerDirty = true; }
    }
  }catch(_){ S.pin = "missing"; }
  soft();
}
let taT;
function onPartner(fk,q){
  V["_pq_"+fk] = q; V[fk] = null; clearTimeout(taT);
  const u0 = $("pl_"+fk); if(q.trim().length<2){ u0 && u0.classList.add("hidden"); return; }
  taT = setTimeout(async ()=>{ const list = await API.partners(q.trim()), u = $("pl_"+fk); if(!u) return;
    u.innerHTML = list.length ? list.slice(0,8).map(p=>`<li><button type="button" data-fk="${fk}" data-pick="${esc(p.id)}" data-name="${esc(p.Account_Name)}">${esc(p.Account_Name)}</button></li>`).join("") : `<li class="sub" style="padding:7px 8px">No account matches “${esc(q)}”</li>`;
    u.classList.remove("hidden"); },250);
}
let toastT; function toast(t){ const el = $("toast"); el.textContent = t; el.classList.remove("hidden"); clearTimeout(toastT); toastT = setTimeout(()=>el.classList.add("hidden"),2600); }

/* ============ HOME LIST ============ */
const FILTERS = [["all","All"],["mine","Raised by me"],["draft","Drafts"],["zh","With ZH"],["rejected","Rejected"],["zhok","ZH approved"],["av","With AV"]];
const L = {filter:"all", q:"", page:1, more:false, rows:[], loading:false};
let listSeq = 0, qT;
function criteria(f){
  const c = [], esc2 = t => t.replace(/[(),]/g,"\\$&");
  if(f.filter==="mine") c.push("(Raised_by:equals:"+S.user.id+")");
  if(f.filter==="draft") c.push("(Status:equals:"+CFG.STATUS.DRAFT+")");
  if(f.filter==="zh") c.push("(Event_Tag:equals:"+esc2(CFG.TAG.PENDING_ZH)+")");
  if(f.filter==="rejected") c.push("(Status:equals:"+CFG.STATUS.REJECTED+")");
  if(f.filter==="zhok") c.push("(Event_Tag:equals:"+esc2(CFG.TAG.ZH_OK)+")");
  if(f.filter==="av") c.push("(Event_Tag:equals:"+esc2(CFG.TAG.PENDING_AV)+")");
  const t = esc2((f.q||"").trim());
  if(t){ const parts = ["(Name:starts_with:"+t+")"]; if(/^\d{1,4}$/.test(t)) parts.push("(Event_Number:equals:ME - "+t.padStart(4,"0")+")"); c.push(parts.length>1?"("+parts.join("or")+")":parts[0]); }
  return c.length ? (c.length>1 ? "("+c.join("and")+")" : c[0]) : "";
}
function matches(r,f){
  if(f.filter==="mine" && !(r[C.raisedBy]&&r[C.raisedBy].id===S.user.id)) return false;
  if(f.filter==="draft" && r.Status!==CFG.STATUS.DRAFT) return false;
  if(f.filter==="zh" && r.Event_Tag!==CFG.TAG.PENDING_ZH) return false;
  if(f.filter==="rejected" && r.Status!==CFG.STATUS.REJECTED) return false;
  if(f.filter==="zhok" && r.Event_Tag!==CFG.TAG.ZH_OK) return false;
  if(f.filter==="av" && r.Event_Tag!==CFG.TAG.PENDING_AV) return false;
  if(f.q && !((r.Name||"")+" "+(r.Event_Number||"")).toLowerCase().includes(f.q.toLowerCase())) return false;
  return true;
}
async function loadList(){
  const seq = ++listSeq; L.loading = true; renderList();
  try{ const r = await API.list(L); if(seq!==listSeq) return; L.rows = r.rows; L.more = r.more; L.error = ""; }
  catch(err){ if(seq===listSeq){ L.rows = []; L.more = false; L.error = (err&&err.message)||"Unknown error"; } }
  L.loading = false; renderList();
}
function renderList(){
  $("filterBtns").innerHTML = FILTERS.map(([k,l])=>`<button type="button" data-filter="${k}" aria-pressed="${L.filter===k}">${esc(l)}</button>`).join("");
  const head = `<colgroup><col class="c-no"><col class="c-ev"><col class="c-dt"><col class="c-ow"><col class="c-st"><col class="c-tg"></colgroup><thead><tr><th scope="col">Event no.</th><th scope="col">Event</th><th scope="col">Date</th><th scope="col">Owner</th><th scope="col">Status</th><th scope="col">Tag</th></tr></thead>`;
  let body;
  if(L.loading) body = `<tr><td colspan="6" class="empty">Loading requests…</td></tr>`;
  else if(L.error) body = `<tr><td colspan="6" class="empty">Couldn’t load requests: ${esc(L.error)}</td></tr>`;
  else if(!L.rows.length) body = `<tr><td colspan="6" class="empty">${L.filter==="all"&&!L.q?"No event requests yet. Click “+ New event” to raise one.":"No requests match this filter."}</td></tr>`;
  else body = L.rows.map(r=>`<tr><td data-l="no">${esc(r.Event_Number||"–")}</td><td data-l="event" title="${esc(r.Name||"")}"><button type="button" class="open" data-open="${esc(r.id)}">${esc(r.Name||"Untitled")}</button></td><td data-l="date">${esc(ordinalDate(r.Event_Date)||"–")}</td><td data-l="owner">${esc((r.Owner&&r.Owner.name)||"–")}</td><td data-l="status">${r.Status?`<span class="chip">${esc(r.Status)}</span>`:"–"}</td><td data-l="tag" title="${esc(r.Event_Tag||"")}">${esc(r.Event_Tag||"")}</td></tr>`).join("");
  $("list").innerHTML = head+"<tbody>"+body+"</tbody>";
  $("pageInfo").textContent = L.rows.length ? "Page "+L.page : "";
  $("prevPg").disabled = L.page<=1||L.loading; $("nextPg").disabled = !L.more||L.loading;
}
function show(v){ S.view = v; $("listView").classList.toggle("hidden",v!=="list"); $("formView").classList.toggle("hidden",v!=="form"); $("bar").classList.toggle("hidden",v!=="form"); window.scrollTo(0,0); }
function blank(){ S.shareMode = "%"; S.tab = "event"; S.tl = null; S.tlAll = false; S.recordId = null; S.rec = {}; V = {}; S.files = {}; S.owner = null; S.zh = null; S.districtName = ""; S.districtId = null; S.pin = "idle"; S.ownerDirty = false; S.prefilled = false; clearErr(); }
function showList(){ show("list"); loadList(); }
function newRecord(){ blank(); V.country = "India"; show("form"); render(); }
async function openRecord(id){
  blank(); show("form"); $("msg").textContent = "Loading the request…"; $("btns").innerHTML = "";
  try{ const rec = await API.load(id); if(!rec.id) throw new Error("Record not found or no access."); loadRecord(rec); }
  catch(err){ $("msg").textContent = "Couldn’t open: "+(err.message||err); $("msg").classList.add("err"); }
}

/* ============ PREVIEW ============ */
function setRole(r){
  S.role = r; S.user = {id:"me", name:r==="MKT"?"Preview Marketing user":"Preview GTM user"};
  document.querySelectorAll("[data-role]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.role===r)));
  if(S.view==="form" && S.recordId) openRecord(S.recordId); else if(S.view==="form") render(); else loadList();
}

/* ============ BOOT ============ */
async function boot(entityId){
  const u = await API.me(); if(S.live) S.role = u.role; else u.name = S.role==="MKT"?"Preview Marketing user":"Preview GTM user"; S.user = {id:u.id, name:u.name};
  if(entityId) openRecord(entityId); else showList();
}
if(window.ZOHO && ZOHO.embeddedApp){
  S.live = true;
  ZOHO.embeddedApp.on("PageLoad", d=>{
    const pos = String((d && (d.ButtonPosition || d.buttonPosition)) || "");
    const id = d && (Array.isArray(d.EntityId)?d.EntityId[0]:d.EntityId);
    boot(/detail/i.test(pos) ? id : null);   // list / mass-action / web tab → home list
  });
  ZOHO.embeddedApp.init();
} else {
  $("demoBar").classList.remove("hidden");
  S.role = new URLSearchParams(location.search).get("as")==="gtm" ? "GTM" : "MKT";
  $("resetDemo").addEventListener("click",()=>{ MOCK.rows = []; MOCK.n = 0; showList(); });
  boot(null);
}
</script>
</body>
</html>
